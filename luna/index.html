<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6cfdc">
<title>Luna's English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE friendly, for a beginner learner
   IDEA a scrapbook page: cream paper clipped to a pink striped wall (the person's Pinterest picture)
   COLOUR stripes #f6cfdc/#fde9f0, paper #ebe6d9, ink #3d3431, rose #c1557c, gold, silver
   TYPE Caveat (handwriting) for headings, Nunito for tasks (both have Cyrillic) */
:root{
  color-scheme:light;
  --ink:#3d3431;--mute:#7b6d66;--paper:#ebe6d9;--paper2:#e3ddcd;--line:#d4ccb9;
  --rose:#c1557c;--rose-d:#9e3a60;--rose-l:#f8dbe5;
  --ok:#3f7d4e;--ok-l:#dcebd8;--bad:#b9443f;--bad-l:#f6d9d5;
  --hand:"Caveat",cursive;--text:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;min-width:0}
html{background:#fde9f0}
body{
  margin:0;color:var(--ink);font:17px/1.5 var(--text);min-height:100vh;overflow-x:clip;
  background-color:#fde9f0;
  background-image:repeating-linear-gradient(90deg,#f6cfdc 0 34px,#fde9f0 34px 68px);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.stage{position:relative;max-width:760px;margin:0 auto;padding:78px 16px 90px}
@media (min-width:700px){.stage{padding:96px 56px 110px}}

/* the pink letter scrap behind the paper */
.letter{
  position:absolute;left:-6px;top:440px;width:150px;height:420px;z-index:0;
  transform:rotate(-7deg);border-radius:2px;overflow:hidden;
  background:linear-gradient(160deg,#e9a7bb,#dd8ea6 55%,#e5a2b6);
  box-shadow:0 6px 14px rgba(120,40,70,.18);
  font:500 19px/1.35 var(--hand);color:rgba(130,30,60,.55);padding:12px 10px;
}
.letter p{margin:0;transform:skewX(-6deg)}
@media (min-width:700px){.letter{left:0;width:190px}}

/* the paper */
.paper{
  position:relative;z-index:1;background:var(--paper);border:5px solid #fbf9f4;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 14px 30px rgba(110,60,80,.20);
  padding:46px 22px 40px;min-height:640px;
}
.paper::before{ /* paper grain and a soft fold */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background:
    linear-gradient(176deg,transparent 52%,rgba(255,255,255,.35) 53%,rgba(120,100,80,.06) 55%,transparent 58%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .40  0 0 0 0 .33  0 0 0 .32 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.paper>*{position:relative}
@media (min-width:700px){.paper{padding:56px 48px 48px}}

.clip,.paperclip,.star,.letter{pointer-events:none}
.clip{position:absolute;z-index:3;top:-34px;left:14%;width:150px}
.paperclip{position:absolute;z-index:3;top:-14px;right:28px;width:44px}
.star{position:absolute;z-index:3;filter:drop-shadow(0 3px 3px rgba(80,40,50,.28))}
.star.silver{left:-14px;top:560px;width:84px;transform:rotate(-14deg)}
.star.gold{right:-12px;top:470px;width:62px;transform:rotate(12deg)}
@media (min-width:700px){.star.silver{left:22px;width:96px}.star.gold{right:24px}}

/* type */
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(46px,9vw,64px);color:var(--rose-d)}
h2{font-size:clamp(34px,6.5vw,44px);color:var(--rose-d)}
h3{font-size:30px;color:var(--ink)}
.sub{color:var(--mute);margin:.25em 0 0}
.ua{color:var(--mute);font-size:.88em}
.hand{font-family:var(--hand);font-size:1.35em;line-height:1}

/* home */
.score{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:700}
.bar{flex:1;height:12px;border-radius:99px;background:var(--paper2);box-shadow:inset 0 1px 2px rgba(0,0,0,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e7a6bb,var(--rose));border-radius:99px;transition:width .5s}
.lessons{list-style:none;margin:18px 0 0;padding:0;border-top:1px dashed var(--line)}
.lessons a{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none}
.lessons a:hover .lt{color:var(--rose-d)}
.num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 28px/1 var(--hand);color:#fff;background:var(--rose);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.done .num{background:var(--ok)}
.lt{font-weight:800;display:block}
.lstars{margin-left:auto;flex:none;letter-spacing:1px;font-size:20px;color:#cbbfa9;white-space:nowrap}
.lstars b{color:#d9a520;font-weight:400}
.tip{margin-top:26px;padding:12px 14px;border-left:4px solid var(--rose);background:rgba(255,255,255,.35)}

/* lesson */
.back{display:inline-block;margin-bottom:14px;color:var(--rose-d);font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.words li{display:flex;align-items:center;gap:8px;background:#fbf8f1;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px}
.words b{font-weight:800}
.say{border:0;background:var(--rose-l);color:var(--rose-d);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.say:hover{background:#f2c3d3}
.say svg{width:16px;height:16px}
section.task{margin-top:34px;padding-top:24px;border-top:2px dashed var(--line)}
.thead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tnum{font:700 30px/1 var(--hand);color:var(--rose)}
.items{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:14px}
.q{font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fbf8f1;border-radius:12px;padding:6px 14px;font-weight:700;min-height:42px;transition:transform .1s,background .15s,border-color .15s}
.chip:hover{border-color:#d9b0bf}
.chip:active{transform:scale(.96)}
.chip.sel{background:var(--rose-l);border-color:var(--rose);color:var(--rose-d)}
.chip.ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.chip[disabled]{cursor:default}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);text-align:center;color:var(--rose-d)}
.fill input{width:9em;max-width:100%;border:0;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.45);padding:2px 6px;font-weight:800;color:var(--rose-d);border-radius:4px 4px 0 0;text-align:center}
.fill input:focus{outline:2px solid var(--rose);outline-offset:2px}
.fill input.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-l)}
.fill input.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-l)}
.bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding:8px 10px;border:1px dashed #d9b0bf;border-radius:10px}
.bank .chip{min-height:34px;padding:2px 12px;font-weight:600}
.fix{color:var(--ok);font-weight:700;font-size:.92em;margin-left:6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
.match .col{display:grid;gap:8px;align-content:start}
.match .chip{width:100%;text-align:left}
.match .chip .tag{float:right;font:700 20px/1 var(--hand);opacity:.8}
.p0{background:#f8dbe5!important;border-color:#d77ea0!important}
.p1{background:#dfe9f7!important;border-color:#7d9fd0!important}
.p2{background:#f7ecc9!important;border-color:#cfa93f!important}
.p3{background:#e3f0dc!important;border-color:#86b06f!important}
.p4{background:#ece0f5!important;border-color:#a585c4!important}
.p5{background:#f9e1d0!important;border-color:#d79461!important}
.p6{background:#dff1ef!important;border-color:#62ab9f!important}
.p7{background:#efe7dc!important;border-color:#a8927a!important}
.match .chip.ok{background:var(--ok-l)!important;border-color:var(--ok)!important}
.match .chip.bad{background:var(--bad-l)!important;border-color:var(--bad)!important}
.line{min-height:48px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.35);border-radius:6px 6px 0 0}
.line.ok{border-color:var(--ok);background:var(--ok-l)}
.line.bad{border-color:var(--bad);background:var(--bad-l)}
.line:empty::before{content:"tap the words below…";color:var(--mute);font-style:italic;font-size:.9em}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:44px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:10px 22px;font-weight:800;background:var(--rose);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.btn:hover{background:var(--rose-d)}
.btn.ghost{background:transparent;color:var(--rose-d);box-shadow:inset 0 0 0 2px var(--rose)}
.btn.ghost:hover{background:var(--rose-l)}
.result{font:700 28px/1 var(--hand)}
.result.good{color:var(--ok)}
.result.meh{color:var(--rose-d)}
.finish{margin-top:40px;padding:22px;text-align:center;border:2px dashed var(--rose);border-radius:16px;background:rgba(255,255,255,.35)}
.finish .big{font-size:44px;letter-spacing:4px;color:#d9a520}
.finish .big s{text-decoration:none;color:#cbbfa9}
.foot{margin-top:30px;text-align:center;font-size:.85em;color:var(--mute)}
.foot button{border:0;background:none;color:var(--mute);text-decoration:underline;padding:0}
/* pictures */
.pic{display:block;background:#fff;padding:6px 6px 8px;box-shadow:0 3px 8px rgba(90,50,60,.18);border-radius:2px;transform:rotate(-1.5deg)}
.pic img{display:block;width:100%;height:100%;object-fit:contain}
.items li.has-img{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
.items li.has-img .pic{width:92px;height:92px}
.items li.has-img:nth-child(even) .pic{transform:rotate(2deg)}
.match .chip.imgchip{padding:4px;text-align:center;min-height:0}
.match .chip.imgchip img{display:block;width:100%;height:84px;object-fit:contain}
.rule{margin-top:22px;padding:16px 18px;background:#fbf8f1;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 0 var(--line);position:relative}
.rule::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;margin-left:-45px;background:rgba(232,160,185,.55);transform:rotate(-2deg)}
.rule table{width:100%;border-collapse:collapse}
.rule td{padding:6px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
.rule tr:last-child td{border-bottom:0}
.rule td:first-child{font-weight:800;color:var(--rose-d)}
.rule td:last-child{color:var(--mute);font-size:.9em;text-align:right}
.intro{margin-top:12px}
.speech{position:relative;display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:700;margin:4px 0}
.listen{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--rose-l);color:var(--rose-d);border-radius:99px;padding:4px 12px 4px 6px;font-weight:700;margin-top:8px}
.listen .say{width:26px;height:26px;background:#fff}
/* the funny bus scene */
.scene{position:relative;width:100%;max-width:560px;aspect-ratio:1/0.95;margin:14px auto 0}
.scene img{position:absolute;height:auto;filter:drop-shadow(0 4px 4px rgba(90,60,60,.15))}
.scene .s-bus{left:2%;bottom:4%;width:72%;z-index:1}
.scene .s-panda{left:34%;top:2.5%;width:30%;z-index:2}
.scene .s-giraffe{left:0;top:0;width:26%;animation:float 4s ease-in-out infinite}
.scene .s-wolf{right:0;bottom:0;width:26%;z-index:2}
/* kitchen scene */
.scene.kitchen{aspect-ratio:1/0.78}
.kitchen .k-oven{left:0;bottom:0;width:38%;z-index:1}
.kitchen .k-bowl{left:6%;bottom:47%;width:25%;z-index:2}
.kitchen .k-plate{left:46%;bottom:2%;width:32%;z-index:1;filter:drop-shadow(0 3px 5px rgba(90,60,60,.3))}
.kitchen .k-fork{left:41%;bottom:3%;width:3.2%;z-index:2}
.kitchen .k-knife{left:79%;bottom:4%;width:20%;z-index:2}
.kitchen .k-mug{left:44%;bottom:44%;width:19%;z-index:1}
.kitchen .k-cups{right:2%;bottom:40%;width:17%;z-index:1}
.kitchen .k-panda{left:63%;top:2%;width:17%;z-index:3;animation:float 4s ease-in-out infinite}
/* no-sign over a picture */
.pic{position:relative}
.pic.multi{display:flex;gap:2px}
.pic.multi img{width:50%}
.pic.no::after{content:"";position:absolute;inset:4px;border:5px solid #c0392b;border-radius:50%;background:linear-gradient(45deg,transparent calc(50% - 3px),#c0392b calc(50% - 3px),#c0392b calc(50% + 3px),transparent calc(50% + 3px));opacity:.85}
/* plate warm-up */
.platewrap{margin-top:12px;text-align:center}
.plate{position:relative;width:min(340px,86%);aspect-ratio:1;margin:0 auto}
.plate img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(90,60,60,.28))}
.food{position:absolute;transform:translate(-50%,-50%);border:0;background:none;font-size:clamp(34px,9vw,48px);line-height:1;padding:0;animation:pop .35s ease-out;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.food:disabled{cursor:default}
.platesay{min-height:3em;margin:12px auto 0;max-width:30em;font-weight:600;font-size:1.05em}
.platesay b{color:var(--rose-d)}
.foods{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.foodchip{display:inline-flex;align-items:center;gap:6px}
.foodchip .emo{font-size:24px;line-height:1}
.foodchip:disabled{opacity:.45}
/* CVC reading */
.items.cvc{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cvccard{background:#fbf8f1;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.tiles{display:flex;justify-content:center;gap:8px;margin:4px 0 8px}
.tile{width:58px;height:66px;border:2px solid var(--line);border-radius:12px;background:#fff;font:800 40px/1 var(--text);color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .12s,background .12s}
.tile.vowel{color:var(--rose)}
.tile.lit{background:#fff4c4;border-color:#e0b93a;transform:translateY(-4px)}
.tile:disabled{cursor:pointer}
.cvcbtns{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.cvccard .q{margin:10px 0 6px;font-weight:600;color:var(--mute);font-size:.9em}
.opts.pics{justify-content:center}
.pic-opt{font-size:30px;line-height:1;padding:6px 12px}
.items.letters .line .chip,.items.letters .pool .chip{font-size:22px;min-width:44px}
.letters .line:empty::before{content:"tap the letters below…"}
/* I spy */
.spywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.spyword{font-size:20px;min-height:40px}
.spypic{position:relative;margin-top:12px;border:5px solid #fff;box-shadow:0 4px 12px rgba(90,50,60,.2);border-radius:6px;overflow:hidden;cursor:crosshair}
.spypic img{display:block;width:100%;height:auto}
.spypic.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.found{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(63,125,78,.9);color:#fff;font-weight:800;display:grid;place-items:center;border:3px solid #fff;animation:pop .35s ease-out;pointer-events:none}
.spymsg{min-height:1.6em;margin:10px 0 0;font-weight:600}
.spymsg .good,.heard .good{color:var(--ok);font-weight:800}
/* join */
.joincard .cols{display:flex;gap:8px}
.joincard .col{display:grid;gap:6px}
.jl{width:46px;height:46px;border-radius:50%;border:2px solid #7fb3d9;background:#fff;font:800 22px/1 var(--text);color:#1f5f8f}
.jl.vowel{color:var(--rose)}
.jl.sel{background:#d8ecfa;border-color:#1f6fb0;transform:scale(1.08)}
.built{display:flex;gap:4px;margin-top:8px}
.built .box{width:44px;height:48px;border:2px solid #7fb3d9;border-radius:6px;background:#fff;display:grid;place-items:center;font:800 24px/1 var(--text)}
.built.ok .box{border-color:var(--ok);background:var(--ok-l)}
.built.bad .box{border-color:var(--bad);background:var(--bad-l)}
.joincard .listen{margin-top:8px}
.items.join li.has-img{grid-template-columns:110px 1fr}
.items.join li.has-img .pic{width:110px;height:110px}
/* colour the scarf */
.key{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keyb{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fbf8f1;border-radius:14px;padding:4px 10px 4px 4px}
.keyb img{width:48px;height:40px;object-fit:contain}
.keyb .blob{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.keyb.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(61,52,49,.15);transform:translateY(-2px)}
.scarf{display:flex;align-items:stretch;margin-top:16px}
.tiles2{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:0;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.tiles2 .word{border:0;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:#fff;font:600 22px/1 var(--hand);font-family:var(--text);padding:14px 4px;transition:background .15s}
.tiles2 .word.ok{box-shadow:inset 0 0 0 3px var(--ok)}
.tiles2 .word.bad{box-shadow:inset 0 0 0 3px var(--bad)}
.fringe{width:14px;background:repeating-linear-gradient(180deg,var(--ink) 0 3px,transparent 3px 9px)}
.imgopt img{width:54px;height:44px;object-fit:contain;display:block}
@media (max-width:460px){.items.join li.has-img{grid-template-columns:80px 1fr}.items.join li.has-img .pic{width:80px;height:80px}.jl{width:40px;height:40px}.built .box{width:38px;height:42px}}
/* speaking */
.spk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spk .listen{margin-top:0}
.btn.mic{padding:8px 18px}
.btn.said{padding:8px 14px}
.btn:disabled{opacity:.6}
.heard{margin-top:6px;min-height:1.5em}
.heard .good{color:var(--ok);font-weight:800}
.heard .try{color:var(--rose-d);font-weight:700}
.scene .lbl{position:absolute;font:700 22px/1 var(--hand);color:var(--rose-d);white-space:nowrap}
@keyframes float{50%{transform:translateY(-8px)}}
@media (max-width:460px){.items li.has-img{grid-template-columns:72px 1fr}.items li.has-img .pic{width:72px;height:72px}.match .chip.imgchip img{height:64px}}
@media (max-width:460px){.match{gap:8px}.match .chip{padding:6px 10px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{display:inline-block;animation:pop .45s ease-out}
</style>
</head>
<body>
<div class="stage">
  <div class="letter" aria-hidden="true"><p>Dear Luna, my dear friend, how are you? I hope you are well. Today is a sunny day and the birds sing. I like my school and my teacher. Love you, write soon! Dear Luna, my dear friend, how are you? I hope you are well. Today is a sunny day and the birds sing. I like my school.</p></div>

  <main class="paper" id="paper">
    <!-- gold binder clip -->
    <svg class="clip" viewBox="0 0 150 80" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc8c"/><stop offset=".45" stop-color="#d7b24e"/><stop offset="1" stop-color="#a98226"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b99130"/><stop offset=".5" stop-color="#f4e19a"/><stop offset="1" stop-color="#b99130"/></linearGradient>
      </defs>
      <path d="M52 40 C52 10 98 10 98 40" fill="none" stroke="url(#g2)" stroke-width="6"/>
      <rect x="66" y="6" width="18" height="12" rx="4" fill="url(#g1)"/>
      <circle cx="75" cy="12" r="3" fill="#8d6c1f"/>
      <path d="M44 38 H106 L104 54 H46 Z" fill="url(#g1)"/>

<script src="lessons.js?v=20261127a"></script>
<script>
(function(){
"use strict";
var L = window.LESSONS || [];
var KEY = "luna-english-v1";
var view = document.getElementById("view");

/* ---------- saved progress ---------- */
var store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
function tState(lid, ti){ store[lid] = store[lid] || {}; return store[lid][ti] = store[lid][ti] || {}; }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim(); }
function seeded(str){ var h = 2166136261; for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return function(){ h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)%100000)/100000; }; }
function shuffle(arr, seed){ var a = arr.slice(), r = seeded(seed); for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } if (a.length>1 && a.every(function(x,i){return x===arr[i];})) a.push(a.shift()); return a; }
function isImg(s){ return /\.(jpe?g|png|webp|gif|svg)$/i.test(String(s)); }
function picHtml(src, no){ var srcs=[].concat(src); return '<span class="pic'+(srcs.length>1?' multi':'')+(no?' no':'')+'">'+srcs.map(function(x){ return '<img src="'+esc(x)+'" alt="" loading="lazy">'; }).join("")+'</span>'; }
function withImg(li, it){ if (it.img){ li.classList.add("has-img"); li.insertBefore(el(picHtml(it.img, it.no)), li.firstChild); var w = el('<div></div>'); while (li.children.length>1) w.appendChild(li.children[1]); li.appendChild(w); } return li; }
function el(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function count(t){ return t.type==="match" ? t.pairs.length : t.type==="plate" ? 1 : t.type==="colour" ? t.words.length : t.items.length; }
function starsFor(score,total){ var p = total ? score/total : 0; return p>=.9?3:p>=.7?2:1; }
function lessonStats(les){
  var sc=0, tot=0, done=0, s = store[les.id] || {};
  les.tasks.forEach(function(t,i){ var st=s[i]; tot+=count(t); if (st && st.checked){ done++; sc+=st.score; } });
  return {score:sc,total:tot,done:done,all:les.tasks.length,stars: done===les.tasks.length ? starsFor(sc,tot) : 0};
}
var speakIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var SOUNDS = {ck:"kuh",ss:"sss",ff:"fff",ll:"lll",sh:"shh",ch:"chuh",a:"ah",b:"buh",c:"kuh",d:"duh",e:"eh",f:"fff",g:"guh",h:"huh",i:"ih",j:"juh",k:"kuh",l:"lll",m:"mmm",n:"nnn",o:"aw",p:"puh",q:"kwuh",r:"rrr",s:"sss",t:"tuh",u:"uh",v:"vvv",w:"wuh",x:"ks",y:"yuh",z:"zzz"};
function utter(txt, rate){
  var u = new SpeechSynthesisUtterance(txt); u.lang = "en-GB"; u.rate = rate || .85;
  var v = speechSynthesis.getVoices().filter(function(v){ return /^en[-_]GB/i.test(v.lang); })[0] || speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); })[0];
  if (v) u.voice = v; return u;
}
function speakSeq(list, each, done){
  if (!("speechSynthesis" in window)){ list.forEach(function(_,k){ each && each(k); }); done && done(); return; }
  speechSynthesis.cancel(); var k = 0;
  (function next(){
    if (k>=list.length){ done && done(); return; }
    var item = list[k], u = utter(item.t, item.r); var idx = k++;
    each && each(idx);
    var fired = false, go = function(){ if (fired) return; fired = true; setTimeout(next, item.pause||250); };
    u.onend = go; u.onerror = go; setTimeout(go, 2500);
    speechSynthesis.speak(u);
  })();
}
function speak(txt){
  if (!("speechSynthesis" in window)) return;
  var u = new SpeechSynthesisUtterance(txt.replace(/\(.*?\)/g,"")); u.lang = "en-GB"; u.rate = .85;
  var v = speechSynthesis.getVoices().filter(function(v){ return /^en[-_]GB/i.test(v.lang); })[0] || speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); })[0];
  if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function starStr(n){ var s=""; for (var i=0;i<3;i++) s += i<n ? "<b>★</b>" : "★"; return s; }

/* ---------- home ---------- */
function home(){
  var got=0, max=L.length*3;
  var rows = L.map(function(les,i){
    var st = lessonStats(les); got += st.stars;
    var status = st.done===0 ? "" : st.done<st.all ? " · "+st.done+" of "+st.all+" tasks done" : "";
    return '<li class="'+(st.stars?"done":"")+'"><a href="#/'+esc(les.id)+'"><span class="num">'+(i+1)+'</span><span><span class="lt">'+esc(les.title)+'</span><span class="ua">'+esc(les.ua||"")+status+'</span></span><span class="lstars" aria-label="'+st.stars+' of 3 stars">'+starStr(st.stars)+'</span></a></li>';
  }).join("");
  view.innerHTML =
    '<h1>Luna\'s English</h1><p class="sub">Lessons and tasks · <span class="ua">уроки і завдання</span></p>'+
    '<div class="score"><span class="hand" style="color:#b8901f">★ '+got+'</span><span class="bar"><i style="width:'+(max?got/max*100:0)+'%"></i></span><span class="ua">'+got+' / '+max+' stars</span></div>'+
    '<ul class="lessons">'+rows+'</ul>'+
    '<p class="tip">Open a lesson, learn the new words, then do the tasks and press <b>Check</b>. Your stars are saved on this device.<br><span class="ua">Відкрий урок, вивчи нові слова, виконай завдання і натисни Check. Зірочки зберігаються на цьому пристрої.</span></p>';
  document.title = "Luna's English";
}

/* ---------- lesson ---------- */
function lesson(les){
  var idx = L.indexOf(les);
  view.innerHTML = '<a class="back" href="#/">← All lessons</a>'+
    '<p class="hand" style="color:var(--rose);margin:0">Lesson '+(idx+1)+'</p><h2>'+esc(les.title)+'</h2><p class="sub ua">'+esc(les.ua||"")+'</p>';
  if (les.words && les.words.length){
    var w = el('<div style="margin-top:22px"><h3>New words</h3><ul class="words"></ul></div>');
    les.words.forEach(function(p){
      var li = el('<li><span><b>'+esc(p[0])+'</b> <span class="ua">— '+esc(p[1])+'</span></span><button class="say" type="button" aria-label="Listen: '+esc(p[0])+'">'+speakIcon+'</button></li>');
      li.querySelector("button").onclick = function(){ speak(p[0]); };
      w.querySelector("ul").appendChild(li);
    });
    view.appendChild(w);
  }
  if (les.rule && les.rule.length){
    var r = el('<div class="rule"><h3>'+esc(les.ruleTitle||"Remember")+'</h3><table></table></div>');
    les.rule.forEach(function(row){ r.querySelector("table").appendChild(el('<table><tr><td>'+esc(row[0])+'</td><td>'+esc(row[1]||"")+'</td></tr></table>').querySelector("tr")); });
    view.appendChild(r);
  }
  les.tasks.forEach(function(t,i){ view.appendChild(task(les,t,i)); });
  var fin = el('<div class="finish" id="finish"></div>'); view.appendChild(fin); finish(les);
  document.title = les.title + " · Luna's English";
}

function finish(les){
  var f = document.getElementById("finish"); if (!f) return;
  var st = lessonStats(les), idx = L.indexOf(les), next = L[idx+1];
  if (st.done < st.all){
    f.innerHTML = '<p class="hand" style="font-size:30px;margin:0">'+st.done+' of '+st.all+' tasks done</p><p class="ua" style="margin:.3em 0 0">Finish all the tasks to get your stars! · Виконай усі завдання, щоб отримати зірочки!</p>';
  } else {
    var s=""; for (var i=0;i<3;i++) s += i<st.stars ? "★" : "<s>★</s>";
    var msg = st.stars===3 ? "Excellent, Luna!" : st.stars===2 ? "Well done, Luna!" : "Good try! Practise again?";
    f.innerHTML = '<div class="big pop">'+s+'</div><p class="hand" style="font-size:36px;margin:.1em 0;color:var(--rose-d)">'+msg+'</p><p style="margin:0">'+st.score+' of '+st.total+' answers correct</p>'+
      '<div class="actions" style="justify-content:center">'+(next?'<a class="btn" href="#/'+esc(next.id)+'" style="text-decoration:none">Next lesson →</a>':'')+'<a class="btn ghost" href="#/" style="text-decoration:none">All lessons</a></div>';
  }
}

/* ---------- tasks ---------- */
function task(les,t,ti){
  var sec = el('<section class="task"><div class="thead"><span class="tnum">'+(ti+1)+'.</span><h3>'+esc(t.title||"")+'</h3>'+(t.ua?'<span class="ua">'+esc(t.ua)+'</span>':'')+'</div><div class="body"></div><div class="actions"><button class="btn chk" type="button">Check</button><button class="btn ghost again" type="button" hidden>Try again</button><span class="result" aria-live="polite"></span></div></section>');
  if (t.intro || t.say){
    var intro = el('<div class="intro">'+(t.intro||"")+'</div>');
    if (t.say){ var lb = el('<button class="listen" type="button"><span class="say">'+speakIcon+'</span>Listen</button>'); lb.onclick = function(){ speak(t.say); }; intro.appendChild(lb); }
    sec.insertBefore(intro, sec.querySelector(".body"));
  }
  var body = sec.querySelector(".body"), chk = sec.querySelector(".chk"), again = sec.querySelector(".again"), res = sec.querySelector(".result");
  var st = tState(les.id, ti); st.a = st.a || {};
  var seed = les.id+":"+ti;
  var impl = ({choose:Choose,fill:Fill,match:Match,order:Order,plate:Plate,cvc:Cvc,speak:Speak,spy:Spy,join:Join,colour:Colour})[t.type];
  if (!impl){ body.textContent = "Unknown task type: "+t.type; return sec; }
  var api = impl(t, st, body, seed);

  function showResult(){
    res.className = "result " + (st.score===count(t) ? "good" : "meh");
    res.innerHTML = '<span class="pop">'+(t.type==="plate" ? (st.score ? "Yum! Bon appétit! 😋" : "Your plate is empty!") : (st.score===count(t) ? "Perfect! " : "")+st.score+' / '+count(t))+'</span>';
    chk.hidden = true; again.hidden = false;
  }
  chk.onclick = function(){
    st.score = api.check(); st.checked = true; save(); showResult(); finish(les);
  };
  again.onclick = function(){
    st.a = {}; st.checked = false; st.score = 0; save();
    sec.replaceWith(task(les,t,ti)); finish(les);
  };
  if (st.checked){ st.score = api.check(); showResult(); }
  return sec;
}

function lock(root){ root.querySelectorAll("button.chip,input").forEach(function(b){ b.disabled = true; }); }

function Choose(t, st, body, seed){
  var ul = el('<ul class="items"></ul>');
  t.items.forEach(function(it,i){
    var li = el('<li><div class="q">'+esc(it.q).replace(/_{2,}/g,'<span class="blank">'+(st.a[i]?esc(st.a[i]):"&nbsp;")+'</span>')+'</div><div class="opts"></div></li>');
    it.options.forEach(function(o){
      var b = el('<button class="chip" type="button">'+esc(o)+'</button>');
      if (st.a[i]===o) b.classList.add("sel");
      b.onclick = function(){
        st.a[i] = o; save();
        li.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("sel", c===b); });
        var bl = li.querySelector(".blank"); if (bl) bl.textContent = o;
      };
      li.querySelector(".opts").appendChild(b);
    });
    ul.appendChild(withImg(li, it));
  });
  body.appendChild(ul);
  return { check: function(){
    var n=0;
    t.items.forEach(function(it,i){
      var li = ul.children[i];
      li.querySelectorAll(".chip").forEach(function(c){
        var o = c.textContent;
        if (o===st.a[i]) c.classList.add(o===it.answer?"ok":"bad");
        else if (o===it.answer && st.a[i]!==it.answer) c.classList.add("ok");
      });
      if (st.a[i]===it.answer) n++;
    });
    lock(ul); return n;
  }};
}

function Fill(t, st, body, seed){
  var ul = el('<ul class="items fill"></ul>'), last = null;
  t.items.forEach(function(it,i){
    var li = el('<li><div class="q"></div></li>');
    var parts = it.q.split(/_{2,}/);
    var q = li.querySelector(".q");
    q.appendChild(document.createTextNode(parts[0]));
    var inp = el('<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer '+(i+1)+'">');
    inp.value = st.a[i] || "";
    inp.oninput = function(){ st.a[i] = inp.value; save(); };
    inp.onfocus = function(){ last = inp; };
    inp.onkeydown = function(e){ if (e.key==="Enter"){ var n = ul.querySelectorAll("input")[i+1]; if (n) n.focus(); else body.parentNode.querySelector(".chk").click(); } };
    q.appendChild(inp);
    q.appendChild(document.createTextNode(parts.slice(1).join("")));
    ul.appendChild(withImg(li, it));
  });
  body.appendChild(ul);
  if (t.bank && t.bank.length){
    var bank = el('<div class="bank"><span class="ua">Words:</span></div>');
    t.bank.forEach(function(w){
      var b = el('<button class="chip" type="button">'+esc(w)+'</button>');
      b.onclick = function(){
        var inputs = [].slice.call(ul.querySelectorAll("input"));
        var target = (last && !last.value) ? last : inputs.filter(function(x){ return !x.value; })[0] || last;
        if (!target) return;
        target.value = w; target.dispatchEvent(new Event("input"));
        var nxt = inputs.filter(function(x){ return !x.value; })[0]; last = nxt || target;
      };
      bank.appendChild(b);
    });
    body.appendChild(bank);
  }
  return { check: function(){
    var n=0;
    t.items.forEach(function(it,i){
      var inp = ul.querySelectorAll("input")[i];
      var ok = [].concat(it.answer).some(function(a){ return a==="*" ? norm(inp.value)!=="" : norm(a)===norm(inp.value); });
      inp.classList.add(ok?"ok":"bad");
      var old = inp.parentNode.parentNode.querySelector(".fix"); if (old) old.remove();
      if (!ok) inp.parentNode.parentNode.appendChild(el('<span class="fix">'+([].concat(it.answer)[0]==="*" ? "write any word ✍" : "✓ "+esc([].concat(it.answer)[0]))+'</span>'));
      if (ok) n++;
    });
    lock(body); return n;
  }};
}

function Match(t, st, body, seed){
  // st.a: { leftIndex: rightIndex }
  var rightOrder = shuffle(t.pairs.map(function(_,i){ return i; }), seed);
  var wrap = el('<div class="match"><div class="col left"></div><div class="col right"></div></div>');
  var lc = wrap.querySelector(".left"), rc = wrap.querySelector(".right");
  var picked = null, lb = [], rb = [];
  t.pairs.forEach(function(p,i){
    var b = el('<button class="chip'+(isImg(p[0])?' imgchip':'')+'" type="button" aria-label="'+esc(isImg(p[0])?'picture '+(i+1):p[0])+'"><span class="tag"></span>'+(isImg(p[0])?'<img src="'+esc(p[0])+'" alt="">':esc(p[0]))+'</button>');
    b.onclick = function(){ if (st.a[i]!=null){ delete st.a[i]; save(); } picked = (picked===i ? null : i); paint(); };
    lb[i]=b; lc.appendChild(b);
  });
  rightOrder.forEach(function(ri){
    var b = el('<button class="chip" type="button"><span class="tag"></span>'+esc(t.pairs[ri][1])+'</button>');
    b.onclick = function(){
      var owner = Object.keys(st.a).filter(function(k){ return st.a[k]===ri; })[0];
      if (picked==null){ if (owner!=null){ delete st.a[owner]; save(); paint(); } return; }
      if (owner!=null) delete st.a[owner];
      st.a[picked] = ri; picked = null; save(); paint();
    };
    rb[ri]=b; rc.appendChild(b);
  });
  function paint(){
    var colorOf = {}, n = 0;
    t.pairs.forEach(function(_,i){ if (st.a[i]!=null) colorOf[i] = n++; });
    t.pairs.forEach(function(_,i){
      lb[i].className = "chip" + (isImg(t.pairs[i][0])?" imgchip":"") + (picked===i ? " sel" : "") + (st.a[i]!=null ? " p"+(colorOf[i]%8) : "");
      lb[i].querySelector(".tag").textContent = st.a[i]!=null ? colorOf[i]+1 : "";
    });
    t.pairs.forEach(function(_,ri){
      var owner = Object.keys(st.a).filter(function(k){ return st.a[k]===ri; })[0];
      rb[ri].className = "chip" + (owner!=null ? " p"+(colorOf[owner]%8) : "");
      rb[ri].querySelector(".tag").textContent = owner!=null ? colorOf[owner]+1 : "";
    });
  }
  paint();
  body.appendChild(el('<p class="ua" style="margin:8px 0 0">Tap a word on the left, then its pair on the right. · Натисни слово зліва, потім його пару справа.</p>'));
  body.appendChild(wrap);
  return { check: function(){
    var n=0;
    t.pairs.forEach(function(_,i){
      var ok = st.a[i]===i;
      lb[i].classList.add(ok?"ok":"bad");
      if (st.a[i]!=null) rb[st.a[i]].classList.add(ok?"ok":"bad");
      if (!ok) lb[i].querySelector(".tag").textContent = "→ " + t.pairs[i][1];
      if (ok) n++;
    });
    lock(wrap); return n;
  }};
}

function Order(t, st, body, seed){
  var ul = el('<ul class="items"></ul>');
  var lists = [];
  t.items.forEach(function(item,i){
    var sent = typeof item==="string" ? item : item.s;
    var m = sent.trim().match(/^(.*?)([.!?]*)$/);
    var words = t.letters ? m[1].replace(/\s+/g,"").split("") : m[1].split(/\s+/), punct = m[2];
    var order = shuffle(words.map(function(_,k){ return k; }), seed+":"+i);
    var chosen = st.a[i] = (st.a[i] || []).filter(function(k){ return k < words.length; });
    var li = el('<li><div class="line"></div><div class="pool"></div></li>');
    var line = li.querySelector(".line"), pool = li.querySelector(".pool");
    function draw(){
      line.innerHTML = ""; pool.innerHTML = "";
      chosen.forEach(function(k,pos){
        var b = el('<button class="chip" type="button">'+esc(words[k])+'</button>');
        b.onclick = function(){ chosen.splice(pos,1); save(); draw(); };
        line.appendChild(b);
      });
      if (chosen.length===words.length && punct) line.appendChild(el('<span style="font-weight:800">'+esc(punct)+'</span>'));
      order.forEach(function(k){
        if (chosen.indexOf(k)>-1) return;
        var b = el('<button class="chip" type="button">'+esc(words[k])+'</button>');
        b.onclick = function(){ chosen.push(k); save(); draw(); };
        pool.appendChild(b);
      });
    }
    draw();
    if (t.letters) li.classList.add("letters");
    lists.push({li:li,line:line,words:words,chosen:chosen,sent:sent});
    ul.appendChild(typeof item==="string" ? li : withImg(li, item));
  });
  body.appendChild(ul);
  return { check: function(){
    var n=0;
    lists.forEach(function(x){
      var said = x.chosen.map(function(k){ return x.words[k]; }).join(t.letters ? "" : " ");
      var ok = x.chosen.length===x.words.length && norm(said)===norm(x.words.join(t.letters ? "" : " "));
      x.line.classList.add(ok?"ok":"bad");
      if (!ok) (x.li.classList.contains("has-img") ? x.li.lastChild : x.li).appendChild(el('<div class="fix" style="margin:6px 0 0">✓ '+esc(x.sent)+'</div>'));
      if (ok) n++;
    });
    lock(ul); return n;
  }};
}

var NUMS = ["zero","one","two","three","four","five","six","seven","eight","nine"];
function Plate(t, st, body, seed){
  // st.a: { foodIndex: how many }
  var MAXEACH = 3, MAXALL = 9;
  var SPOTS = [[50,50],[30,34],[68,32],[28,64],[70,66],[50,24],[50,77],[36,49],[64,49]];
  var wrap = el('<div class="platewrap"><div class="plate"><img src="'+esc(t.plate||"img/plate.webp")+'" alt="a plate"></div><p class="platesay" aria-live="polite"></p><div class="foods"></div></div>');
  var plate = wrap.querySelector(".plate"), say = wrap.querySelector(".platesay"), foods = wrap.querySelector(".foods");
  var locked = false;
  function total(){ var n=0; for (var k in st.a) n += st.a[k]; return n; }
  function sentence(){
    var parts = [];
    t.foods.forEach(function(f,i){ var n = st.a[i]||0; if (!n) return;
      parts.push(n===1 ? "there is " + f.one : "there are " + NUMS[n] + " " + f.many); });
    if (!parts.length) return "My plate is empty! 😮 Tap the food to put it on the plate.";
    var txt = parts.length===1 ? parts[0] : parts.slice(0,-1).join(", ") + " and " + parts[parts.length-1];
    return "On my plate today " + txt + ".";
  }
  function draw(){
    plate.querySelectorAll(".food").forEach(function(x){ x.remove(); });
    var k = 0;
    t.foods.forEach(function(f,i){
      for (var c=0;c<(st.a[i]||0);c++){
        var sp = SPOTS[k++ % SPOTS.length];
        var b = el('<button class="food" type="button" aria-label="Take off '+esc(f.one)+'" style="left:'+sp[0]+'%;top:'+sp[1]+'%">'+f.e+'</button>');
        b.onclick = (function(i){ return function(){ if (locked) return; st.a[i]--; if (!st.a[i]) delete st.a[i]; save(); draw(); }; })(i);
        plate.appendChild(b);
      }
    });
    var s = sentence();
    say.innerHTML = esc(s).replace(/(there is|there are)/g,"<b>$1</b>");
    foods.querySelectorAll(".chip").forEach(function(b,i){ b.disabled = locked || total()>=MAXALL || (st.a[i]||0)>=MAXEACH; });
  }
  t.foods.forEach(function(f,i){
    var b = el('<button class="chip foodchip" type="button"><span class="emo">'+f.e+'</span>'+esc(f.name || f.one.replace(/^(a|an) /,""))+'</button>');
    b.onclick = function(){ if (locked || total()>=MAXALL || (st.a[i]||0)>=MAXEACH) return; st.a[i] = (st.a[i]||0)+1; save(); draw(); };
    foods.appendChild(b);
  });
  var lb = el('<button class="listen" type="button"><span class="say">'+speakIcon+'</span>Listen</button>');
  lb.onclick = function(){ speak(sentence().replace(/[^\w\s.,'!?]/g,"")); };
  wrap.insertBefore(lb, foods);
  body.appendChild(wrap);
  draw();
  return { check: function(){ locked = true; draw(); return total() ? 1 : 0; } };
}

/* CVC reading: tap letters to hear sounds, blend, then pick the picture */
function Cvc(t, st, body, seed){
  var ul = el('<ul class="items cvc"></ul>');
  t.items.forEach(function(it,i){
    var li = el('<li class="cvccard"><div class="tiles"></div><div class="cvcbtns"></div><div class="q">Which picture is it?</div><div class="opts pics"></div></li>');
    var tiles = li.querySelector(".tiles");
    var letters = it.w.indexOf("-")>-1 ? it.w.split("-") : it.w.split(""); var word = it.w.replace(/-/g,"");
    letters.forEach(function(ch,k){
      var b = el('<button class="tile'+(/[aeiou]/.test(ch)?' vowel':'')+'" type="button" aria-label="sound '+esc(ch)+'">'+esc(ch)+'</button>');
      b.onclick = function(){ lightOnly(k); speakSeq([{t:SOUNDS[ch]||ch, r:.7}], null, function(){ lightOnly(-1); }); };
      tiles.appendChild(b);
    });
    function lightOnly(k){ tiles.querySelectorAll(".tile").forEach(function(x,j){ x.classList.toggle("lit", j===k); }); }
    function lightUpTo(k){ tiles.querySelectorAll(".tile").forEach(function(x,j){ x.classList.toggle("lit", j<=k); }); }
    var slow = el('<button class="listen" type="button"><span class="say">🐢</span>Sound it out</button>');
    slow.onclick = function(){
      var seq = letters.map(function(ch){ return {t:SOUNDS[ch]||ch, r:.7, pause:350}; });
      seq.push({t:word, r:.6, pause:300}); seq.push({t:word, r:.9});
      speakSeq(seq, function(k){ if (k<letters.length) lightUpTo(k); else lightUpTo(letters.length); }, function(){ setTimeout(function(){ lightOnly(-1); }, 600); });
    };
    var fast = el('<button class="listen" type="button"><span class="say">🐇</span>Read it</button>');
    fast.onclick = function(){ lightUpTo(letters.length); speakSeq([{t:word, r:.85}], null, function(){ lightOnly(-1); }); };
    li.querySelector(".cvcbtns").appendChild(slow); li.querySelector(".cvcbtns").appendChild(fast);
    var opts = shuffle(it.options, seed+":"+i);
    opts.forEach(function(o){
      var b = el('<button class="chip pic-opt'+(isImg(o)?' imgopt':'')+'" type="button">'+(isImg(o)?'<img src="'+esc(o)+'" alt="">':o)+'</button>');
      b.dataset.v = o;
      if (st.a[i]===o) b.classList.add("sel");
      b.onclick = function(){ st.a[i] = o; save(); li.querySelectorAll(".pic-opt").forEach(function(c){ c.classList.toggle("sel", c===b); }); };
      li.querySelector(".opts").appendChild(b);
    });
    ul.appendChild(li);
  });
  body.appendChild(el('<p class="ua" style="margin:8px 0 0">Tap each letter to hear its sound. Say the sounds, then say them fast together: c-u-p → cup! Then choose the picture.<br>Натисни на кожну літеру, щоб почути звук. Скажи звуки, потім разом швидко. Обери картинку.</p>'));
  body.appendChild(ul);
  return { check: function(){
    var n = 0;
    t.items.forEach(function(it,i){
      ul.children[i].querySelectorAll(".pic-opt").forEach(function(c){
        var o = c.dataset.v;
        if (o===st.a[i]) c.classList.add(o===it.pic?"ok":"bad");
        else if (o===it.pic && st.a[i]!==it.pic) c.classList.add("ok");
      });
      if (st.a[i]===it.pic) n++;
    });
    lock(ul); ul.querySelectorAll(".tile").forEach(function(b){ b.disabled = false; });
    return n;
  }};
}

/* Speaking: she says a sentence; the browser listens (if it can) */
function Speak(t, st, body, seed){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var ul = el('<ul class="items speak"></ul>');
  function norm2(x){ return norm(x).replace(/\bisnt\b/g,"isn't").replace(/\barent\b/g,"aren't").replace(/\bis not\b/g,"isn't").replace(/\bare not\b/g,"aren't").replace(/\btheres\b|\bthere's\b/g,"there is"); }
  function good(it, said){
    var x = " " + norm2(said) + " ";
    return (it.need||[]).every(function(alts){ return alts.split("|").some(function(a){ return x.indexOf(" "+norm2(a)+" ")>-1; }); }) && norm(said).split(" ").length >= (it.min||3);
  }
  t.items.forEach(function(it,i){
    var li = el('<li><div class="q">'+esc(it.q)+'</div><div class="spk"></div><div class="heard" aria-live="polite"></div></li>');
    var spk = li.querySelector(".spk"), heard = li.querySelector(".heard");
    var ex = el('<button class="listen" type="button"><span class="say">'+speakIcon+'</span>Example</button>');
    ex.onclick = function(){ speak(it.example); };
    var mic = el('<button class="btn mic" type="button">🎤 Speak</button>');
    var said = el('<button class="btn ghost said" type="button">✓ I said it</button>');
    function show(){
      var a = st.a[i];
      heard.innerHTML = !a ? "" : a.text ? 'I heard: <b>“'+esc(a.text)+'”</b> '+(a.ok ? '<span class="good">⭐ Great sentence!</span>' : '<span class="try">Try again, use: '+esc(it.hint||"")+'</span>') : (a.self ? '<span class="good">⭐ Well done!</span>' : "");
    }
    if (SR){
      mic.onclick = function(){
        var r = new SR(); r.lang = "en-GB"; r.interimResults = false; r.maxAlternatives = 3;
        mic.disabled = true; mic.textContent = "👂 Listening…";
        r.onresult = function(e){
          var alts = [].slice.call(e.results[0]).map(function(x){ return x.transcript; });
          var best = alts.filter(function(x){ return good(it,x); })[0];
          st.a[i] = { text: best || alts[0], ok: !!best }; save(); show();
        };
        r.onerror = function(e){ heard.innerHTML = e.error==="not-allowed" ? 'The microphone is off. Say it to your teacher and tap “I said it”.' : "I didn't hear you. Try again!"; };
        r.onend = function(){ mic.disabled = false; mic.textContent = "🎤 Speak"; };
        try { r.start(); } catch(e){ mic.disabled = false; }
      };
      spk.appendChild(ex); spk.appendChild(mic); spk.appendChild(said);
    } else {
      spk.appendChild(ex); spk.appendChild(said);
      heard.innerHTML = '<span class="ua">Say it out loud, then tap “I said it”.</span>';
    }
    said.onclick = function(){ st.a[i] = st.a[i] && st.a[i].ok ? st.a[i] : { self:true, ok:true }; save(); show(); };
    if (it.img) withImg(li, it);
    ul.appendChild(li); show();
  });
  body.appendChild(el('<p class="ua" style="margin:8px 0 0">Make your own sentence and say it out loud! Press 🎤 and speak (allow the microphone), or say it to your teacher and tap “I said it”.<br>Склади своє речення і скажи його вголос!</p>'));
  body.appendChild(ul);
  return { check: function(){
    var n = 0; t.items.forEach(function(_,i){ if (st.a[i] && st.a[i].ok) n++; });
    lock(ul); return n;
  }};
}

/* I Spy: read a word, then find it in the picture */
function Spy(t, st, body, seed){
  // st.a: { itemIndex: true } found
  var wrap = el('<div class="spy"><div class="spywords"></div><div class="spypic"><img src="'+esc(t.img)+'" alt="'+esc(t.alt||"A picture to search")+'"></div><p class="spymsg" aria-live="polite"></p></div>');
  var words = wrap.querySelector(".spywords"), pic = wrap.querySelector(".spypic"), msg = wrap.querySelector(".spymsg");
  var cur = null, locked = false;
  function firstLeft(){ for (var i=0;i<t.items.length;i++) if (!st.a[i]) return i; return null; }
  function draw(){
    words.innerHTML = ""; pic.querySelectorAll(".found").forEach(function(x){ x.remove(); });
    t.items.forEach(function(it,i){
      var b = el('<button class="chip spyword'+(st.a[i]?' ok':'')+(cur===i?' sel':'')+'" type="button">'+(st.a[i]?'✓ ':'')+esc(it.w)+'</button>');
      b.onclick = function(){ if (locked) return; cur = i; msg.innerHTML = 'Find: <b>'+esc(it.w)+'</b> 🔎 <span class="ua">— tap it in the picture</span>'; draw(); };
      words.appendChild(b);
      if (st.a[i]){ var bx = it.box; pic.appendChild(el('<span class="found" style="left:'+((bx[0]+bx[2])/2)+'%;top:'+((bx[1]+bx[3])/2)+'%">✓</span>')); }
    });
  }
  pic.onclick = function(e){
    if (locked) return;
    if (cur==null || st.a[cur]){ cur = firstLeft(); if (cur==null) return; }
    var r = pic.getBoundingClientRect(), x = (e.clientX-r.left)/r.width*100, y = (e.clientY-r.top)/r.height*100;
    var bx = t.items[cur].box;
    if (x>=bx[0] && x<=bx[2] && y>=bx[1] && y<=bx[3]){
      st.a[cur] = true; save(); speak(t.items[cur].w);
      msg.innerHTML = '<span class="good">Yes! I spy a '+esc(t.items[cur].w)+'! ⭐</span>';
      cur = firstLeft(); draw();
      if (cur==null) msg.innerHTML = '<span class="good">You found them all! 🎉 Press Check.</span>';
    } else {
      msg.innerHTML = 'Hmm, not there. Look again for the <b>'+esc(t.items[cur].w)+'</b>! 👀';
      pic.classList.remove("shake"); void pic.offsetWidth; pic.classList.add("shake");
    }
  };
  cur = firstLeft();
  if (cur!=null) msg.innerHTML = 'Read the word, then find it in the picture! Start with: <b>'+esc(t.items[cur].w)+'</b>';
  body.appendChild(wrap); draw();
  return { check: function(){ locked = true; var n=0; t.items.forEach(function(_,i){ if (st.a[i]) n++; }); words.querySelectorAll("button").forEach(function(b){ b.disabled = true; }); return n; } };
}

/* Say it, join it: pick one letter in each column to build the word */
function Join(t, st, body, seed){
  var ul = el('<ul class="items join"></ul>');
  t.items.forEach(function(it,i){
    var li = el('<li class="joincard"><div class="cols"></div><div class="built"></div></li>');
    var cols = li.querySelector(".cols"), built = li.querySelector(".built");
    st.a[i] = st.a[i] || [];
    function draw(){
      cols.querySelectorAll(".jl").forEach(function(b){ b.classList.toggle("sel", st.a[i][+b.dataset.c]===b.dataset.v); });
      built.innerHTML = it.cols.map(function(_,c){ return '<span class="box">'+esc(st.a[i][c]||"")+'</span>'; }).join("");
    }
    it.cols.forEach(function(opts,c){
      var col = el('<div class="col"></div>');
      opts.forEach(function(v){
        var b = el('<button class="jl'+(/^[aeiou]$/.test(v)?' vowel':'')+'" type="button">'+esc(v)+'</button>');
        b.dataset.c = c; b.dataset.v = v;
        b.onclick = function(){ st.a[i][c] = v; save(); draw(); speakSeq([{t:SOUNDS[v]||v, r:.7}]); };
        col.appendChild(b);
      });
      cols.appendChild(col);
    });
    var sayb = el('<button class="listen" type="button"><span class="say">'+speakIcon+'</span>Say it</button>');
    sayb.onclick = function(){ speak(it.cols.length ? it.w : it.w); };
    li.insertBefore(sayb, built);
    draw();
    ul.appendChild(withImg(li, it));
  });
  body.appendChild(el('<p class="ua" style="margin:8px 0 0">Look at the picture and say the word. Tap one letter in each column to build it. · Подивись на картинку, скажи слово і склади його: обери одну літеру в кожному стовпчику.</p>'));
  body.appendChild(ul);
  return { check: function(){
    var n=0;
    t.items.forEach(function(it,i){
      var ok = (st.a[i]||[]).join("")===it.w;
      var li = ul.children[i]; li.querySelector(".built").classList.add(ok?"ok":"bad");
      if (!ok) (li.lastChild).appendChild(el('<div class="fix">✓ '+esc(it.w)+'</div>'));
      if (ok) n++;
    });
    lock(ul); return n;
  }};
}

/* Read and colour: pick a colour from the key, tap the words */
function Colour(t, st, body, seed){
  var cur = 0, locked = false;
  var wrap = el('<div class="colour"><div class="key"></div><div class="scarf"><span class="fringe l"></span><div class="tiles2"></div><span class="fringe r"></span></div></div>');
  var key = wrap.querySelector(".key"), tiles = wrap.querySelector(".tiles2");
  t.key.forEach(function(k,j){
    var b = el('<button class="keyb" type="button" aria-label="'+esc(k.c)+' for '+esc(k.w)+'"><img src="'+esc(k.img)+'" alt=""><span class="blob" style="background:'+esc(k.c)+'"></span></button>');
    b.onclick = function(){ cur = j; paint(); };
    key.appendChild(b);
  });
  t.words.forEach(function(w,i){
    var b = el('<button class="word" type="button">'+esc(w)+'</button>');
    b.onclick = function(){ if (locked) return; if (st.a[i]===cur) delete st.a[i]; else st.a[i] = cur; save(); paint(); speak(w); };
    tiles.appendChild(b);
  });
  function paint(){
    key.querySelectorAll(".keyb").forEach(function(b,j){ b.classList.toggle("sel", j===cur); });
    tiles.querySelectorAll(".word").forEach(function(b,i){ var k = st.a[i]; b.style.background = k!=null ? t.key[k].c : ""; b.classList.toggle("painted", k!=null); });
  }
  body.appendChild(el('<p class="ua" style="margin:8px 0 0">1) Tap a picture to choose its colour. 2) Read the words on the scarf and tap every word that matches. · Обери колір (натисни на картинку), потім натискай на слова, які їй відповідають.</p>'));
  body.appendChild(wrap); paint();
  return { check: function(){
    locked = true; var n=0;
    t.words.forEach(function(w,i){
      var ok = st.a[i]!=null && t.key[st.a[i]].w===w;
      tiles.children[i].classList.add(ok?"ok":"bad"); if (ok) n++;
    });
    return n;
  }};
}

/* ---------- routing ---------- */
function route(){
  var id = location.hash.replace(/^#\/?/,"");
  var les = L.filter(function(l){ return l.id===id; })[0];
  if (les) lesson(les); else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();

/* reset link */
var foot = el('<p class="foot">Made with love for Luna · <button type="button">start again (clear stars)</button></p>');
foot.querySelector("button").onclick = function(){
  if (foot.dataset.sure){ store = {}; save(); delete foot.dataset.sure; this.textContent = "start again (clear stars)"; route(); }
  else { foot.dataset.sure = 1; this.textContent = "tap again to clear all stars"; }
};
document.getElementById("paper").appendChild(foot);
if ("speechSynthesis" in window) speechSynthesis.getVoices();
})();
