<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff2f4">
<title>Alyona's English</title>
<script>
/* Old flashcard links (#join=..., #teacher) belong to the flashcards page. */
if(/join=|teacher/.test(location.hash))location.replace("cards.html"+location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* Alyona's hub. Same look as her Miro lessons and flashcards:
   blush ground, navy + pale-blue badges, rose notes, white cards, Rammetto One + Lora.
   Content comes from the Google Sheet "Alyona – English hub" (data.json is the fallback copy). */
:root{--bg:#fff2f4;--ink:#1a1a1a;--soft:#403f41;--rose:#c18c7e;--navy:#013b60;--sky:#d9e7ea;--pink:#f9d9df;--card:#ffffff;--line:#efe3e5;--ok:#2f8f6b;--bad:#c0504d;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1719;--ink:#f4eeee;--soft:#c9c0c2;--rose:#dba99b;--navy:#9cc8e6;--sky:#203845;--pink:#3a2a2f;--card:#2a2225;--line:#3d3437;--ok:#5cc49a;--bad:#e8807c;--on:#10202b}}
:root[data-theme=dark]{--bg:#1d1719;--ink:#f4eeee;--soft:#c9c0c2;--rose:#dba99b;--navy:#9cc8e6;--sky:#203845;--pink:#3a2a2f;--card:#2a2225;--line:#3d3437;--ok:#5cc49a;--bad:#e8807c;--on:#10202b}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Lora,Georgia,serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
a{color:var(--navy)}
.disp,h2{font-family:"Rammetto One",Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.15;color:var(--navy);margin:0}
h1.disp{font-size:clamp(30px,8.5vw,42px)}
.lvl{display:inline-block;background:var(--navy);color:var(--on);font:700 13px Lora,serif;border-radius:999px;padding:3px 12px;margin-bottom:12px}
.aim{color:var(--rose);font-weight:700;font-style:italic;margin:10px 0 0}
.next{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.next b{color:var(--navy)}
.next svg{width:26px;height:26px;flex:none;color:var(--rose)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.grow{flex:1 1 160px}
button,.btn{font:700 16px Lora,serif;border:0;border-radius:14px;padding:12px 16px;min-height:48px;cursor:pointer;background:var(--navy);color:var(--on);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt,button.alt{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.rose{background:var(--rose);color:#fff}
.btn.off{background:var(--line);color:var(--soft);cursor:default}
button:active,.btn:active{transform:scale(.97)}
.btn svg,button svg{width:20px;height:20px;flex:none}
.small{font-size:14px;color:var(--soft)}
nav.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:22px -16px 0;padding:10px 16px;border-bottom:1px solid var(--line)}
nav.chips::-webkit-scrollbar{display:none}
nav.chips a{flex:none;text-decoration:none;font:700 14px Lora,serif;color:var(--navy);background:var(--sky);border-radius:999px;padding:6px 12px}
section{margin-top:30px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.badge{flex:none;width:46px;height:46px;border-radius:12px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font:400 16px "Rammetto One",serif}
.sh h2{font-size:22px}
.sh .small{margin-top:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 2px 0 var(--pink)}
.box h3{margin:0 0 4px;font:400 17px/1.25 "Rammetto One",serif;color:var(--navy)}
.lbl{color:var(--rose);font-weight:700;font-size:14px}
.empty{color:var(--soft);font-style:italic;margin:0}
/* homework */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px dashed var(--pink)}
.task:first-of-type{border-top:0}
.task input{flex:none;width:26px;height:26px;margin:1px 0 0;accent-color:var(--ok);cursor:pointer}
.task .t{flex:1}
.task.done .t>span{text-decoration:line-through;color:var(--soft)}
.task .open{display:inline-flex;margin-top:6px;font-size:14px;min-height:36px;padding:6px 12px;border-radius:10px;background:var(--sky);color:var(--navy)}
.chk{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:6px;padding:1px 7px;vertical-align:2px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:8px;transition:width .4s}
details.older{margin-top:12px}
details.older summary{cursor:pointer;font-weight:700;color:var(--navy)}
/* flashcards */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 10px}
.stat{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font:400 22px/1.1 "Rammetto One",serif;color:var(--navy)}
.stat span{font-size:13px;color:var(--soft)}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.way{background:var(--sky);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--navy);font-weight:700;line-height:1.3}
.way svg{display:block;margin:0 auto 4px;width:22px;height:22px}
.dk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:10px;font-size:15px}
.dk .bar{grid-column:1/-1}
/* errors */
.toggle{display:flex;align-items:center;gap:10px;margin-top:4px;font-weight:700;color:var(--navy);cursor:pointer;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--navy)}
.grp{margin-top:14px}
.grp .lbl{display:block;margin-bottom:2px}
.fix{padding:10px 0;border-top:1px dashed var(--pink)}
.fix:first-of-type{border-top:0}
.fix .no{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.fix .yes{color:var(--ok);font-weight:700}
.fix .why{color:var(--rose);font-style:italic;font-size:15px;margin-top:2px}
.ln{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.say{flex:none;min-height:36px;padding:6px 10px;border-radius:10px;background:var(--sky);color:var(--navy);font-size:14px}
.say svg{width:18px;height:18px}
.say.ico{width:36px;padding:0}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--pink);flex-wrap:wrap}
.pr:first-of-type{border-top:0}
.pr .w{font-weight:700;color:var(--navy);font-size:18px}
.pr .ipa{color:var(--soft)}
.pr .st{background:var(--pink);color:var(--navy);border-radius:8px;padding:1px 9px;font-weight:700;font-size:14px;margin-left:auto}
.wd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px dashed var(--pink);align-items:baseline}
.wd:first-of-type{border-top:0}
.wd .w{font-weight:700;color:var(--navy)}
.wd .m{color:var(--rose);font-style:italic}
.wd{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.wd .tip{grid-column:1/-1;font-size:14px;color:var(--soft)}
.quiz .hide{filter:blur(6px);cursor:pointer;transition:filter .2s;user-select:none}
.quiz .hide.shown{filter:none}
/* focus, timetable, materials */
.focus{display:grid;gap:10px;margin-top:12px}
.focus .box{margin:0}
.focus .area{display:inline-block;background:var(--navy);color:var(--on);border-radius:999px;font-size:13px;font-weight:700;padding:2px 10px;margin-bottom:6px}
.focus p{margin:4px 0 0}
.focus .how{color:var(--rose);font-style:italic}
.tt{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;padding:10px 0;border-top:1px dashed var(--pink)}
.tt:first-of-type{border-top:0}
.tt .d{font:400 16px "Rammetto One",serif;color:var(--navy)}
.tt .n{grid-column:2;font-size:14px;color:var(--rose);font-style:italic}
.links{display:grid;gap:8px;margin-top:12px}
.lk{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink)}
.lk .ty{flex:none;background:var(--sky);color:var(--navy);border-radius:8px;font-size:12px;font-weight:700;padding:2px 8px}
.lk b{display:block;color:var(--navy)}
.lk .small{display:block}
.ideas{margin:0;padding:0;list-style:none}
.ideas li{position:relative;padding:8px 0 8px 26px;border-top:1px dashed var(--pink)}
.ideas li:first-child{border-top:0}
.ideas li::before{content:"♡";position:absolute;left:2px;top:8px;color:var(--rose);font-weight:700}
.ideas .n{display:block;font-size:14px;color:var(--rose);font-style:italic}
footer{margin-top:36px;text-align:center;color:var(--rose);font-style:italic;font-weight:700;font-size:15px}
footer .small{display:block;font-weight:400;font-style:normal;margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script src="audio/hub.js?v=1"></script>
<script>
const SHEET_ID="1f6GQaFDXwfi6hnsccZ9r-I8jV4xLSGebWluVxOzdovY";
const TABS={Overview:"A4:C",Timetable:"A4:D",Homework:"A4:F",Errors:"A4:F",Focus:"A4:C",Materials:"A4:D",Flashcards:"A4:E"};
/* The flashcard decks on cards.html (card ids are prefix + number). Progress is read from the same browser storage. */
const DECKS=[{id:"ph",title:"Discipline phrases",n:9},{id:"w",title:"Key words",n:18},{id:"g",title:"Collocations",n:17},{id:"st",title:"Word stress",n:8}];

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const I={
 zoom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3"/></svg>',
 board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 9h5M7 12h8"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>',
 brain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="13" height="17" rx="2"/><path d="M8 3v17M20 7v13a2 2 0 01-2 2H8"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

/* ---------- data: Google Sheet first, then the copy in data.json ---------- */
function cellVal(c){
  if(!c||c.v==null)return "";
  if(typeof c.v==="string"){const m=c.v.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return m[1]+"-"+String(+m[2]+1).padStart(2,"0")+"-"+m[3].padStart(2,"0");return c.v.trim()}
  return c.v;
}
async function loadTab(name){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&headers=1&sheet="+encodeURIComponent(name)+"&range="+TABS[name]+"&t="+Date.now();
  const txt=await (await fetch(url,{credentials:"omit"})).text();
  const j=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
  if(j.status!=="ok")throw new Error("sheet");
  const cols=j.table.cols.map(c=>(c.label||"").trim());
  return (j.table.rows||[]).map(r=>{const o={};cols.forEach((h,i)=>{if(h)o[h]=cellVal(r.c[i])});return o})
    .filter(o=>Object.values(o).some(v=>v!==""&&v!==false));
}
async function loadSheet(){
  const names=Object.keys(TABS),out={};
  const res=await Promise.all(names.map(loadTab));
  names.forEach((n,i)=>out[n]=res[i]);
  if(!out.Overview.length)throw new Error("empty");
  return out;
}

/* ---------- helpers ---------- */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function niceDate(s){const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(+m[3])+" "+MONTHS[+m[2]-1]:esc(s)}
const isUrl=s=>/^https?:\/\//i.test(String(s||""));
function groupBy(rows,key){const m=new Map();rows.forEach(r=>{const k=r[key]||"";if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return [...m.entries()].sort((a,b)=>String(b[0]).localeCompare(String(a[0])))}
function hashKey(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return "k"+(h>>>0).toString(36)}

/* ---------- pronunciation: British female voice (Google), phone voice as a fallback ---------- */
let cur=null;
function speakTTS(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";const v=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));const f=v.find(v=>/female|serena|kate|stephanie|martha|libby|sonia|hazel|emma|amy/i.test(v.name))||v[0];if(f)u.voice=f;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
/* Built-in recordings (audio/hub.js, British female voice) play everywhere, also inside Telegram. Anything not recorded yet uses Google's voice, then the phone's. */
function recording(t){const m=window.HUB_AUDIO||{},k=String(t).trim();if(m[k])return m[k];const l=k.toLowerCase();for(const x in m)if(x.toLowerCase()===l)return m[x];return ""}
function say(t){
  let done=false,a=null;const fb=()=>{if(done)return;done=true;try{a&&a.pause()}catch(e){}speakTTS(t)};
  try{if(cur)cur.pause();try{speechSynthesis.cancel()}catch(e){}
    const rec=recording(t);a=new Audio();a.referrerPolicy="no-referrer";a.src=rec?"audio/"+rec:"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-GB&ttsspeed=0.9&q="+encodeURIComponent(String(t).slice(0,190));
    a.onerror=fb;a.onplaying=()=>{done=true};cur=a;const p=a.play();if(p&&p.catch)p.catch(fb);setTimeout(()=>{if(!done&&a.paused)fb()},4000);
  }catch(e){fb()}
}
const sayBtn=(t,icon)=>`<button class="say${icon?" ico":""}" data-say="${esc(t)}" aria-label="Listen: ${esc(t)}">${I.sound}${icon?"":"Listen"}</button>`;
const speakable=s=>String(s).replace(/\(.*?\)/g,"").replace(/^to /,"").trim();

/* ---------- render ---------- */
let D=null;
function render(){
  const ov={};(D.Overview||[]).forEach(r=>ov[String(r.Item).trim()]=r.Value);
  const name=ov.Student||"Alyona",lvl=ov.Level||"B1/B2";
  const zoom=isUrl(ov["Zoom link"])?ov["Zoom link"]:"",miro=isUrl(ov["Miro board"])?ov["Miro board"]:"";
  const zid=ov["Zoom meeting ID"],zpw=ov["Zoom passcode"];
  document.title=name+"'s English";

  /* homework */
  const ticks=LS.get("hub_hw",{});
  const hw=groupBy(D.Homework||[],"Set on");
  const hwSet=([date,tasks],open)=>{
    const done=tasks.filter(t=>ticks[hashKey(date+t.Task)]).length;
    const due=tasks.find(t=>t.Due)?.Due;
    return `<div class="box">
      <h3>${esc(tasks[0].Lesson||"Homework")}</h3>
      <div class="small">Set on ${niceDate(date)}${due?" · due "+niceDate(due):""} · ${done} of ${tasks.length} done</div>
      <div class="bar" style="margin:10px 0 4px"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div>
      ${tasks.map(t=>{const k=hashKey(date+t.Task),on=!!ticks[k];return `<label class="task${on?" done":""}">
        <input type="checkbox" data-hw="${k}" ${on?"checked":""}>
        <span class="t"><span>${esc(t.Task)}</span>${t.Checked===true||t.Checked==="TRUE"?'<span class="chk">checked ✓</span>':""}
        ${isUrl(t.Link)?`<br><a class="btn open" href="${esc(t.Link)}" target="${/englishwitholya\/alyona\//.test(t.Link)?"_self":"_blank"}" rel="noopener">Open</a>`:""}</span></label>`}).join("")}
    </div>`};
  const hwHtml=hw.length?hwSet(hw[0])+(hw.length>1?`<details class="older"><summary>Earlier homework (${hw.length-1})</summary>${hw.slice(1).map(g=>hwSet(g)).join("")}</details>`:""):`<p class="empty">No homework right now.</p>`;

  /* flashcards */
  const prog=LS.get("dc_prog",{}),sessions=LS.get("dc_sessions",[]);
  const learnedIn=pre=>Object.entries(prog).filter(([id,p])=>new RegExp("^"+pre+"\\d+$").test(id)&&(p.box||0)>=3).length;
  const total=DECKS.reduce((a,d)=>a+d.n,0),lt=DECKS.reduce((a,d)=>a+Math.min(d.n,learnedIn(d.id)),0);
  const dk=d=>{const n=new Date(d);return n.getFullYear()+"-"+n.getMonth()+"-"+n.getDate()};
  const days=new Set(sessions.map(s=>dk(s.at)));let streak=0;{const d=new Date();if(!days.has(dk(d)))d.setDate(d.getDate()-1);while(days.has(dk(d))){streak++;d.setDate(d.getDate()-1)}}
  const topics=D.Flashcards||[];
  const fcHtml=topics.length?topics.map((t,i)=>`<div class="box">
      <span class="lbl">${esc(t.Lesson||"")}${t.Date?" · "+niceDate(t.Date):""}</span>
      <h3>${esc(t.Topic)}</h3>
      <div class="small">${esc(t["What's inside"]||"")}</div>
      ${i===0?`<div class="stats"><div class="stat"><b>${lt}/${total}</b><span>learned</span></div><div class="stat"><b>${streak}</b><span>day streak</span></div><div class="stat"><b>${sessions.length}</b><span>sessions</span></div></div>
      ${DECKS.map(d=>{const k=Math.min(d.n,learnedIn(d.id));return `<div class="dk"><span>${esc(d.title)}</span><span class="small">${k}/${d.n}</span><div class="bar"><i style="width:${Math.round(k/d.n*100)}%"></i></div></div>`}).join("")}`:""}
      <div class="ways"><div class="way">${I.sound}Pronunciation</div><div class="way">${I.brain}Memorising</div><div class="way">${I.chart}Progress</div></div>
      <div class="row"><a class="btn grow" href="${esc(isUrl(t.Link)?t.Link:"cards.html")}">Practise this topic</a></div>
    </div>`).join(""):`<p class="empty">New topics will appear here after our lessons.</p>`;

  /* errors */
  const er=groupBy(D.Errors||[],"Date");
  const said=r=>r["You said / word"]??r["You said"]??"",better=r=>r["Better / meaning"]??r["Better"]??"",why=r=>r["Why / tip"]??"";
  const erHtml=er.length?er.map(([date,rows],gi)=>{
    const fixes=rows.filter(r=>!/pronun|new word/i.test(r.Type||"")),prs=rows.filter(r=>/pronun/i.test(r.Type||"")),words=rows.filter(r=>/new word/i.test(r.Type||""));
    const body=`
      ${fixes.length?`<div class="grp"><span class="lbl">Fix these</span>${fixes.map(r=>`<div class="fix"><div class="ln"><span class="no">${esc(said(r))}</span><span>→</span><span class="yes hide">${esc(better(r))}</span>${sayBtn(better(r),1)}</div>${why(r)?`<div class="why">${esc(why(r))}</div>`:""}</div>`).join("")}</div>`:""}
      ${prs.length?`<div class="grp"><span class="lbl">Say it right</span>${prs.map(r=>`<div class="pr"><span class="w">${esc(said(r))}</span><span class="ipa">${esc(better(r))}</span>${why(r)?`<span class="st">${esc(why(r))}</span>`:""}${sayBtn(said(r))}</div>`).join("")}</div>`:""}
      ${words.length?`<div class="grp"><span class="lbl">New words</span>${words.map(r=>`<div class="wd"><span class="w">${esc(said(r))}</span><span class="m hide">${esc(better(r))}</span><span class="wl">${sayBtn(said(r),1)}</span>${why(r)?`<span class="tip">${esc(why(r))}</span>`:""}</div>`).join("")}</div>`:""}`;
    const head=`<span class="lbl">${niceDate(date)}</span><h3>${esc(rows[0].Lesson||"Lesson")}</h3>`;
    return gi===0?`<div class="box">${head}${body}</div>`:`<details class="older box"><summary>${niceDate(date)} · ${esc(rows[0].Lesson||"Lesson")}</summary>${body}</details>`;
  }).join(""):`<p class="empty">After each lesson your corrections will appear here.</p>`;

  /* focus */
  const fo=D.Focus||[];
  const foHtml=fo.length?`<div class="focus">${fo.map(f=>`<div class="box"><span class="area">${esc(f.Area)}</span><p><b>${esc(f["What to focus on"])}</b></p>${f["How to practise"]?`<p class="how">${esc(f["How to practise"])}</p>`:""}</div>`).join("")}</div>`:`<p class="empty">Coming soon.</p>`;

  /* timetable */
  const tt=D.Timetable||[];
  const ttHtml=`<div class="box">${tt.length?tt.map(r=>`<div class="tt"><span class="d">${esc(r.Day)}</span><span><b>${esc(r["Time (Kyiv)"]||r.Time||"")}</b>${r.Length?` · ${esc(r.Length)}`:""}</span>${r.Notes?`<span class="n">${esc(r.Notes)}</span>`:""}</div>`).join("")+`<p class="small" style="margin:8px 0 0">Times are Kyiv time.</p>`:`<p class="empty">Your lesson days and times will appear here soon.</p>`}
    <div class="row">${zoom?`<a class="btn grow" href="${esc(zoom)}" target="_blank" rel="noopener">${I.zoom}Join Zoom</a>`:`<span class="btn off grow">${I.zoom}Zoom link coming soon</span>`}</div>
    ${zid||zpw?`<p class="small" style="margin:8px 0 0">${zid?"Meeting ID: <b>"+esc(zid)+"</b>":""}${zid&&zpw?" · ":""}${zpw?"Passcode: <b>"+esc(zpw)+"</b>":""}</p>`:""}</div>`;

  /* materials */
  const ma=D.Materials||[],links=ma.filter(m=>isUrl(m.Link)),ideas=ma.filter(m=>!isUrl(m.Link));
  const maHtml=(links.length?`<div class="links">${links.map(m=>`<a class="lk" href="${esc(m.Link)}" target="_blank" rel="noopener"><span class="ty">${esc(m.Type||"Link")}</span><span><b>${esc(m.Title)}</b>${m.Notes?`<span class="small">${esc(m.Notes)}</span>`:""}</span></a>`).join("")}</div>`:"")
    +(ideas.length?`<div class="box"><h3>Self-study ideas you chose</h3><ul class="ideas">${ideas.map(m=>`<li>${esc(m.Title)}${m.Notes?`<span class="n">${esc(m.Notes)}</span>`:""}</li>`).join("")}</ul></div>`:"")
    ||`<p class="empty">Coming soon.</p>`;

  const sec=(id,badge,title,sub,html)=>`<section id="${id}"><div class="sh"><span class="badge">${badge}</span><div><h2>${title}</h2>${sub?`<div class="small">${sub}</div>`:""}</div></div>${html}</section>`;

  $("app").innerHTML=`
  <header>
    <span class="lvl">${esc(name)} · ${esc(lvl)}</span>
    <h1 class="disp">Hi, ${esc(name)}!</h1>
    ${ov["Main goal"]?`<p class="aim">Our goal: ${esc(ov["Main goal"])}</p>`:""}
    ${ov["Next lesson"]?`<div class="next">${I.cal}<span>Next lesson: <b>${esc(ov["Next lesson"])}</b></span></div>`:""}
    <div class="row">
      ${zoom?`<a class="btn grow" href="${esc(zoom)}" target="_blank" rel="noopener">${I.zoom}Join Zoom</a>`:`<a class="btn off grow" href="#timetable">${I.zoom}Zoom link coming soon</a>`}
      ${miro?`<a class="btn alt grow" href="${esc(miro)}" target="_blank" rel="noopener">${I.board}Our Miro board</a>`:""}
    </div>
  </header>
  <nav class="chips" aria-label="Sections">
    <a href="#homework">Homework</a><a href="#flashcards">Flashcards</a><a href="#errors">Errors</a><a href="#focus">Focus</a><a href="#timetable">Timetable</a><a href="#materials">Materials</a>
  </nav>
  ${sec("homework","1","Homework","Tick each task when you finish it.",hwHtml)}
  ${sec("flashcards","2","Flashcards by topic","Listen, memorise and watch your progress grow.",fcHtml)}
  ${sec("errors","3","Errors from our lessons","",`<label class="toggle"><input type="checkbox" id="quiz">Test myself: hide the answers</label>${erHtml}`)}
  ${sec("focus","4","What to focus on","",foHtml)}
  ${sec("timetable","5","Timetable & Zoom","",ttHtml)}
  ${sec("materials","6","Additional materials","",maHtml)}
  <footer>English with Olya ♡<span class="small">Your ticks and flashcard progress are saved on this phone.</span></footer>`;

  document.querySelectorAll("[data-hw]").forEach(cb=>cb.onchange=()=>{const t=LS.get("hub_hw",{});if(cb.checked)t[cb.dataset.hw]=Date.now();else delete t[cb.dataset.hw];LS.set("hub_hw",t);const y=scrollY;render();scrollTo(0,y)});
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.preventDefault();say(speakable(b.dataset.say))});
  const q=$("quiz"),sec3=$("errors");q.checked=!!LS.get("hub_quiz",false);sec3.classList.toggle("quiz",q.checked);
  q.onchange=()=>{LS.set("hub_quiz",q.checked);sec3.classList.toggle("quiz",q.checked);sec3.querySelectorAll(".hide.shown").forEach(h=>h.classList.remove("shown"))};
  sec3.querySelectorAll(".hide").forEach(h=>h.onclick=()=>h.classList.add("shown"));
}

(async()=>{
  const cached=LS.get("hub_data",null);
  if(cached){D=cached;render()}
  try{D=await loadSheet();LS.set("hub_data",D);render();return}catch(e){}
  try{D=await (await fetch("data.json?v="+Date.now())).json();render()}
  catch(e){if(!cached)$("app").innerHTML='<p class="empty">Could not load the page. Check your internet and try again.</p>'}
})();
</script>
</body>
</html>
