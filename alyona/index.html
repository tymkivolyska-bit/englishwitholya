<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff2f4">
<title>Discipline Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Styled after the Miro lesson "Discipline - your way to freedom. Lesson 7":
   blush frame, rose instructions, navy + pale-blue task badges, white cards, Rammetto One + serif text */
:root{--bg:#fff2f4;--ink:#1a1a1a;--soft:#403f41;--rose:#c18c7e;--navy:#013b60;--sky:#d9e7ea;--card:#ffffff;--line:#e7e7e7;--ok:#2f8f6b;--bad:#c0504d;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1719;--ink:#f4eeee;--soft:#c9c0c2;--rose:#dba99b;--navy:#9cc8e6;--sky:#203845;--card:#2a2225;--line:#3d3437;--on:#10202b}}
:root[data-theme=dark]{--bg:#1d1719;--ink:#f4eeee;--soft:#c9c0c2;--rose:#dba99b;--navy:#9cc8e6;--sky:#203845;--card:#2a2225;--line:#3d3437;--on:#10202b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Lora,Georgia,serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:580px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.disp{font-family:"Rammetto One",Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.15;color:var(--navy);margin:0}
h1.disp{font-size:clamp(26px,7.4vw,36px)}
.lvl{display:inline-block;background:var(--navy);color:var(--on);font:700 13px Lora,serif;border-radius:999px;padding:3px 12px;margin-bottom:12px}
.aim{color:var(--rose);font-weight:700;font-style:italic;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font:400 24px/1.1 "Rammetto One",serif;color:var(--navy)}
.stat span{font-size:13px;color:var(--soft)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:8px;transition:width .4s}
.deck{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 2px 0 var(--line)}
.dh{display:flex;gap:12px;align-items:center}
.badge{flex:none;width:46px;height:46px;border-radius:12px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font:400 16px "Rammetto One",serif}
.deck h3{margin:0;font:400 19px/1.2 "Rammetto One",serif;color:var(--navy)}
.deck p{margin:8px 0 10px;color:var(--rose);font-weight:700;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,.btn{font:700 16px Lora,serif;border:0;border-radius:14px;padding:12px 16px;min-height:48px;cursor:pointer;background:var(--navy);color:var(--on);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.alt,.btn.alt{background:transparent;color:var(--navy);border:2px solid var(--navy)}
button.rose{background:var(--rose);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
.grow{flex:1}
.small{font-size:14px;color:var(--soft)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.topbar button,.topbar .btn{min-height:40px;padding:8px 12px;font-size:14px}
.count{font-weight:700;color:var(--navy);text-align:right}
.card{position:relative;background:var(--card);border:2px solid var(--sky);border-radius:22px;min-height:320px;padding:52px 22px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;user-select:none}
.card.back{border-color:var(--rose)}
.card .tag{position:absolute;left:18px;top:16px;background:var(--sky);color:var(--navy);font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px}
.big{font:400 clamp(24px,7vw,32px)/1.2 "Rammetto One",serif;color:var(--navy);overflow-wrap:anywhere}
.mid{font:600 21px/1.35 Lora,serif}
.ipa{font-size:18px;color:var(--soft)}
.uk{font:700 24px/1.25 Lora,serif;color:var(--rose)}
.def{font-style:italic;color:var(--soft)}
.ex{background:var(--sky);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink)}
.ex b{color:var(--navy)}
.say{align-self:flex-start;background:var(--sky);color:var(--navy);min-height:44px;padding:8px 14px;font-size:15px}
.say svg{width:20px;height:20px}
.flipnote{position:absolute;right:18px;bottom:12px;font-size:13px;color:var(--soft)}
.opts{display:grid;gap:10px;margin-top:14px}
.opts button{background:var(--card);color:var(--ink);border:2px solid var(--line);justify-content:flex-start;text-align:left;font-weight:600}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
input{font:17px Lora,serif;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--rose)}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:600}
.fb.good{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.result{text-align:center;padding:24px 8px}
.result .score{font:400 64px/1 "Rammetto One",serif;color:var(--rose)}
ul.miss{text-align:left;padding-left:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
label{display:block;font-weight:700;margin:14px 0 6px;color:var(--navy)}
.linkbox{overflow-wrap:anywhere;font-size:13px;background:var(--sky);padding:10px;border-radius:10px}
.status{font-size:15px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
{
/* ---------- content: Miro board "B1 and higher. Discipline - your way to freedom" (Lesson 7) ---------- */
const PHRASES=[
 ["life is fit for life","laɪf ɪz fɪt fə laɪf","жити здоровим і повноцінним життям","live in a way that promotes health and well-being","I went to one seminar one time and now my life is fit for life."],
 ["bring a dream into fruition","brɪŋ ə driːm ˈɪntə fruˈɪʃn","втілити мрію в життя","turn any goal into a reality","At the center of bringing any dream into fruition is self-discipline."],
 ["keep commitments and promises","kiːp kəˈmɪtmənts ən ˈprɒmɪsɪz","дотримуватися зобов'язань і обіцянок","fulfil obligations and promises made to others","Thanks to self-discipline you can keep commitments and promises."],
 ["keep your life on schedule","kiːp jə laɪf ɒn ˈʃedjuːl","жити за розкладом, усе встигати вчасно","manage your time effectively to complete tasks and appointments when planned","Self-discipline keeps your life on schedule."],
 ["meet deadlines","miːt ˈdedlaɪnz","вкладатися в терміни, дотримуватися дедлайнів","complete tasks or projects by the specified due date or time","Meeting deadlines is essential to success."],
 ["string things together","strɪŋ θɪŋz təˈɡeðə","поєднувати, вибудовувати в послідовність","connect various elements or ideas in a coherent sequence","When you string them together, you start to create a day of efficient action."],
 ["at the price of discipline","ət ðə praɪs əv ˈdɪsəplɪn","ціною дисципліни","achieve success through self-control, hard work and dedication","True freedom is purchased at the price of discipline."],
 ["set up your own success","set ʌp jər əʊn səkˈses","створити умови для власного успіху","create conditions or opportunities that lead to achieving your goals","You can set up your own success."],
 ["put yourself under extreme discipline","pʊt jɔːˈself ˈʌndər ɪkˈstriːm ˈdɪsəplɪn","тримати себе в суворій дисципліні","subject yourself to strict rules for personal improvement","I got to put myself under extreme discipline to make sure I'm free."]
].map(([en,ipa,uk,def,ex],i)=>({id:"ph"+i,en,ipa,uk,def,ex}));
const WORDS=[
 ["discipline","ˈdɪsəplɪn","дисципліна"],["self-discipline","ˌselfˈdɪsəplɪn","самодисципліна"],["freedom","ˈfriːdəm","свобода"],
 ["schedule","ˈʃedjuːl","розклад, графік"],["deadline","ˈdedlaɪn","кінцевий термін, дедлайн"],["promise","ˈprɒmɪs","обіцянка"],
 ["commitment","kəˈmɪtmənt","зобов'язання"],["fruition","fruˈɪʃn","здійснення, втілення"],["extreme","ɪkˈstriːm","надзвичайний, суворий"],
 ["success","səkˈses","успіх"],["motivation","ˌməʊtɪˈveɪʃn","мотивація"],["dedication","ˌdedɪˈkeɪʃn","відданість справі"],
 ["efficient","ɪˈfɪʃnt","ефективний, продуктивний"],["crucial","ˈkruːʃl","вирішальний, дуже важливий"],["obstacle","ˈɒbstəkl","перешкода"],
 ["to stick to a plan","stɪk tʊ ə plæn","дотримуватися плану"],["to jot down","dʒɒt daʊn","швидко записати"],["a self-study plan","ə ˌselfˈstʌdi plæn","план самостійного навчання"]
].map(([en,ipa,uk],i)=>({id:"w"+i,en,ipa,uk}));
const GAPS=[
 ["To ___ your life on schedule","keep"],["To keep ___ and promises","commitments"],["To ___ deadlines","meet"],
 ["To ___ any dream into fruition","bring"],["To ___ at the price of discipline","be"],["To ___ myself under extreme discipline","put"],
 ["Life is ___ for life","fit"],["To ___ them together","string"],["To ___ up your own success","set"],
 ["I always keep my life on ___ so I have time for studying English every day.","schedule"],
 ["It's important to keep ___ and promises, like practising speaking with a language partner.","commitments"],
 ["I make sure to ___ deadlines for my language learning goals.","meet"],
 ["By putting myself under extreme discipline, I can bring my dream of speaking fluent English into ___.","fruition"],
 ["Achieving fluency in English comes at the ___ of discipline.","price"],
 ["To succeed in language learning, I ___ together daily vocabulary practice and grammar exercises.","string"],
 ["In order to ___ up my own success in English, I devote 10 minutes a day to English.","set"],
 ["In language learning, life is ___ for life when you are dedicated to improving.","fit"]
].map(([q,a],i)=>({id:"g"+i,q,a,en:q.replace("___",a)}));
const STRESS=[["schedule","SCHE-dule",1],["promises","PRO-mises",1],["deadlines","DEAD-lines",1],["discipline","DIS-cipline",1],
 ["commitments","com-MIT-ments",2],["fruition","fru-I-tion",2],["extreme","ex-TREME",2],["success","suc-CESS",2]]
 .map(([w,s,n],i)=>({id:"st"+i,en:w,q:w,a:n===1?"1st syllable":"2nd syllable",show:s,ipa:(WORDS.find(x=>x.en.replace(/s$/,"")===w.replace(/s$/,""))||{}).ipa||""}));

const DECKS=[
 {id:"ph",badge:"1B",title:"Discipline phrases",about:"The 9 phrases from the video. Meaning, Ukrainian and pronunciation.",kind:"phrase",cards:PHRASES},
 {id:"w",badge:"2B",title:"Key words",about:"Words from the lesson with Ukrainian translation.",kind:"word",cards:WORDS},
 {id:"g",badge:"3A",title:"Complete the collocations",about:"Type the missing word.",kind:"gap",cards:GAPS},
 {id:"st",badge:"3C",title:"Word stress",about:"Is the first or the second syllable stressed?",kind:"stress",cards:STRESS}
];
const ALL=DECKS.flatMap(d=>d.cards);
const PER_SESSION=10;

/* ---------- pronunciation (browser voice, British English if available) ---------- */
let voice=null;
const FEMALE=/female|woman|serena|kate|stephanie|martha|fiona|moira|tessa|karen|samantha|victoria|allison|ava|susan|zira|hazel|libby|sonia|maisie|mia|abbie|bella|amy|emma|jenny|aria|natasha|olivia|x-gba|x-gbc|x-gbg|x-sfg|x-tpc|x-iob/i;
const MALE=/\bmale\b|daniel|arthur|oliver|george|ryan|thomas|rishi|alfie|elliot|noah|ethan|guy|david|mark|james|fred|alex|aaron|gordon|lee|x-gbb|x-gbd|x-rjs/i;
let fallbackPitch=1;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));const gb=v.filter(x=>/en[-_]GB/i.test(x.lang));
  const fem=l=>l.find(x=>FEMALE.test(x.name)&&!/\bmale\b/i.test(x.name.replace(/female/i,"")));
  voice=fem(gb)||fem(v)||gb.find(x=>!MALE.test(x.name))||v.find(x=>!MALE.test(x.name))||gb[0]||v[0]||null;
  fallbackPitch=voice&&FEMALE.test(voice.name)?1:1.25}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/^to /,"to "));if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=.9;u.pitch=fallbackPitch;speechSynthesis.speak(u)}catch(e){}}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const sayBtn=t=>`<button class="say" data-say="${esc(t)}">${SPK} Listen</button>`;
function wireSay(root){root.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)})}

/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=LS.get("fc_cfg",{});
let prog=LS.get("dc_prog",{});
let sessions=LS.get("dc_sessions",[]);
let outbox=LS.get("fc_outbox",[]);
const save=()=>{LS.set("dc_prog",prog);LS.set("dc_sessions",sessions);LS.set("fc_outbox",outbox)};
const studentName=()=>cfg.name||"Alyona";

function readJoin(){
  const m=location.hash.match(/join=([^&]+)/);if(!m)return;
  try{const c=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(c.token&&c.chat){cfg=c;LS.set("fc_cfg",cfg)}}catch(e){}
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){location.hash=""}
}

/* ---------- Telegram ---------- */
async function tgSend(text,c=cfg){
  if(!c.token||!c.chat)return false;
  const url="https://api.telegram.org/bot"+c.token+"/sendMessage",body=new URLSearchParams({chat_id:c.chat,text});
  try{const r=await fetch(url,{method:"POST",body});const j=await r.json();return !!j.ok}
  catch(e){try{await fetch(url,{method:"POST",body,mode:"no-cors"});return true}catch(e2){return false}}
}
async function notify(text){if(!cfg.token)return;outbox.push(text);save();await flush()}
async function flush(){while(outbox.length){const ok=await tgSend(outbox[0]);if(!ok)break;outbox.shift();save()}}

/* ---------- progress ---------- */
const P=id=>prog[id]||(prog[id]={box:0,right:0,wrong:0,last:0});
const learned=cards=>cards.filter(c=>(prog[c.id]?.box||0)>=3).length;
const dayKey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function streak(){
  const days=new Set(sessions.map(s=>dayKey(new Date(s.at))));let n=0,d=new Date();
  if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function pick(deck){
  const now=Date.now();
  return [...deck.cards].map(c=>({c,w:(prog[c.id]?.box||0)*10+Math.random()*8-(now-(prog[c.id]?.last||0))/864e5*.5}))
   .sort((a,b)=>a.w-b.w).slice(0,PER_SESSION).map(x=>x.c).sort(()=>Math.random()-.5);
}
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.?!,]/g,"").replace(/\s+/g," ").trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+"m "+(s%60)+"s"};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const blank=q=>esc(q).replace("___",'<b>______</b>');

/* ---------- views ---------- */
const app=document.getElementById("app");
let S=null;

function home(){
  S=null;const tot=ALL.length,l=learned(ALL);
  app.innerHTML=`
  <span class="lvl">B1 and higher · Lesson 7</span>
  <h1 class="disp">Discipline - your way to freedom</h1>
  <p class="aim">${esc(studentName())}'s flashcards: learn the new phrases, their Ukrainian meaning and how to say them.</p>
  <div class="stats">
    <div class="stat"><b>${l}/${tot}</b><span>learned</span></div>
    <div class="stat"><b>${streak()}</b><span>day streak</span></div>
    <div class="stat"><b>${sessions.length}</b><span>sessions</span></div>
  </div>
  <div class="bar"><i style="width:${Math.round(l/tot*100)}%"></i></div>
  ${DECKS.map(d=>{const n=d.cards.length,k=learned(d.cards);return `
  <section class="deck">
    <div class="dh"><div class="badge">${d.badge}</div><div><h3>${esc(d.title)}</h3><div class="small">${k} of ${n} learned</div></div></div>
    <p>${esc(d.about)}</p>
    <div class="bar"><i style="width:${Math.round(k/n*100)}%"></i></div>
    <div class="row"><button class="alt grow" data-go="flip" data-d="${d.id}">Flashcards</button><button class="grow" data-go="quiz" data-d="${d.id}">Quiz</button></div>
  </section>`}).join("")}
  <div class="panel">
    <b style="color:var(--navy)">Teacher</b>
    <p class="small" style="margin:4px 0 10px">${cfg.token?"Your results go to your teacher in Telegram after each session.":"Not connected to Telegram yet. Ask your teacher for your personal link."}${outbox.length?` ${outbox.length} report(s) waiting to send.`:""}</p>
    <div class="row">${cfg.token?`<button class="rose grow" id="report">Send progress report</button>`:""}<a class="btn alt" href="#teacher">Setup</a></div>
    <div class="status" id="st"></div>
  </div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>start(b.dataset.d,b.dataset.go));
  const r=document.getElementById("report");
  if(r)r.onclick=async()=>{r.disabled=true;const ok=await tgSend(report());document.getElementById("st").textContent=ok?"Sent to your teacher.":"Could not send. Check the internet and try again.";r.disabled=false};
}

function start(deckId,mode){
  const deck=DECKS.find(d=>d.id===deckId);
  S={deck,mode,cards:pick(deck),i:0,right:0,miss:[],t0:Date.now(),answered:false};card();
}
const top=()=>`<div class="topbar"><button class="alt" id="quit">← Back</button><span class="count">${esc(S.deck.title)} · ${S.i+1}/${S.cards.length}</span></div>`;

function faces(c,k){
  if(k==="phrase")return[`<span class="tag">phrase</span><div class="big">${esc(c.en)}</div><div class="ipa">/${esc(c.ipa)}/</div>${sayBtn(c.en)}`,
    `<div class="big" style="font-size:22px">${esc(c.en)}</div><div class="uk">${esc(c.uk)}</div><div class="def">= ${esc(c.def)}</div><div class="ex">“${esc(c.ex)}”</div>${sayBtn(c.ex)}`];
  if(k==="word")return[`<span class="tag">word</span><div class="big">${esc(c.en)}</div><div class="ipa">/${esc(c.ipa)}/</div>${sayBtn(c.en.replace(/^a /,""))}`,
    `<div class="big" style="font-size:22px">${esc(c.en)}</div><div class="uk">${esc(c.uk)}</div>${sayBtn(c.en.replace(/^a /,""))}`];
  if(k==="gap")return[`<span class="tag">complete</span><div class="mid">${blank(c.q)}</div>`,`<div class="mid">${esc(c.en)}</div>${sayBtn(c.en)}`];
  return[`<span class="tag">stress</span><div class="big">${esc(c.en)}</div><div class="small">Which syllable is stressed?</div>`,
    `<div class="big">${esc(c.show)}</div><div class="uk">${esc(c.a)}</div>${c.ipa?`<div class="ipa">/${esc(c.ipa)}/</div>`:""}${sayBtn(c.en)}`];
}

function card(){
  if(S.i>=S.cards.length)return finish();
  const c=S.cards[S.i],k=S.deck.kind;S.answered=false;
  if(S.mode==="flip"){
    const [f,b]=faces(c,k);let flipped=false;
    app.innerHTML=top()+`<div class="card" id="cd"></div>
     <div class="row" id="grade" hidden><button class="bad grow" id="no">Not yet</button><button class="ok grow" id="yes">Got it</button></div>
     <p class="small" style="text-align:center">Tap the card to turn it over</p>`;
    const cd=document.getElementById("cd");
    const draw=()=>{cd.className="card"+(flipped?" back":"");cd.innerHTML=(flipped?b:f)+(flipped?"":'<span class="flipnote">tap to flip</span>');wireSay(cd)};
    draw();
    cd.onclick=()=>{flipped=!flipped;draw();document.getElementById("grade").hidden=false;if(flipped&&k!=="gap")say(c.en.replace(/^a /,""))};
    document.getElementById("yes").onclick=()=>grade(true);
    document.getElementById("no").onclick=()=>grade(false);
  }else if(k==="gap"){
    app.innerHTML=top()+`<div class="card" style="cursor:default;min-height:200px"><span class="tag">complete</span><div class="mid">${blank(c.q)}</div></div>
     <form id="f" style="margin-top:14px"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing word"><div class="row"><button class="grow" type="submit">Check</button></div></form><div id="fbw"></div>`;
    const inp=document.getElementById("inp");inp.focus();
    document.getElementById("f").onsubmit=e=>{e.preventDefault();if(S.answered){next();return}const v=inp.value.trim();if(!v)return;S.answered=true;inp.disabled=true;feedback(norm(v)===norm(c.a),c,v)};
  }else{
    let prompt,opts,right;
    if(k==="stress"){prompt=`<span class="tag">stress</span><div class="big">${esc(c.en)}</div>${sayBtn(c.en)}<div class="small">Which syllable is stressed?</div>`;
      opts=["1st syllable","2nd syllable"].map(x=>({key:x,label:x}));right=c.a;}
    else{
      const useDef=k==="phrase"&&Math.random()<.5;
      prompt=useDef?`<span class="tag">meaning</span><div class="mid" style="font-style:italic">${esc(c.def)}</div><div class="small">Which phrase means this?</div>`
        :`<span class="tag">українською</span><div class="uk" style="font-size:26px">${esc(c.uk)}</div><div class="small">How do you say it in English?</div>`;
      opts=shuffle([c,...shuffle(S.deck.cards.filter(x=>x.id!==c.id)).slice(0,3)]).map(o=>({key:o.id,label:o.en}));right=c.id;}
    app.innerHTML=top()+`<div class="card" style="cursor:default;min-height:200px">${prompt}</div>
     <div class="opts">${opts.map(o=>`<button data-k="${esc(o.key)}">${esc(o.label)}</button>`).join("")}</div><div id="fbw"></div>`;
    wireSay(app);
    app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
      if(S.answered)return;S.answered=true;const ok=b.dataset.k===right;
      app.querySelectorAll(".opts button").forEach(x=>{if(x.dataset.k===right)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");feedback(ok,c,ok?"":b.textContent);
    });
  }
  document.getElementById("quit").onclick=()=>{if(S.i>0)finish(true);else home()};
}

function answerText(c,k){return k==="gap"?c.en:k==="stress"?c.show:c.en+(c.ipa?"  /"+c.ipa+"/":"")}
function feedback(ok,c,given){
  record(ok,c,given);const k=S.deck.kind;
  const w=document.getElementById("fbw");
  w.innerHTML=`<div class="fb ${ok?"good":"no"}">${ok?"Correct!":"Answer: "}<b>${esc(answerText(c,k))}</b>${c.uk&&k!=="stress"?`<div class="small">${esc(c.uk)}</div>`:""}</div><div class="row">${sayBtn(k==="gap"?c.en:c.en.replace(/^a /,""))}<button class="grow" id="nx">Next</button></div>`;
  wireSay(w);if(k!=="gap")say(c.en.replace(/^a /,""));
  const nx=document.getElementById("nx");nx.focus();nx.onclick=next;
}
function record(ok,c,given){
  const p=P(c.id);p.last=Date.now();
  if(ok){p.right++;p.box=Math.min(5,p.box+1);S.right++}else{p.wrong++;p.box=Math.min(p.box,1);S.miss.push({c,given})}
  save();
}
function grade(ok){record(ok,S.cards[S.i],"");next()}
function next(){S.i++;card()}

function missLine(m,k){const c=m.c;
  const what=k==="gap"?c.q+" → "+c.a:k==="stress"?c.en+" → "+c.show:c.en+" ("+c.uk+")";
  return "• "+what+(m.given?" (answered: "+m.given+")":"")}
function finish(early){
  const done=early?S.i:S.cards.length;if(!done)return home();
  const ms=Date.now()-S.t0,k=S.deck.kind;
  sessions.push({deck:S.deck.id,mode:S.mode,score:S.right,total:done,ms,at:Date.now()});save();
  const pct=Math.round(S.right/done*100);
  const msg=`📚 ${studentName()} finished a session\n${S.deck.title} · ${S.mode==="flip"?"Flashcards":"Quiz"}${early?" (stopped early)":""}\nScore: ${S.right}/${done} (${pct}%)\nTime: ${fmtTime(ms)}\n`+
    (S.miss.length?`\nTo review:\n${S.miss.map(m=>missLine(m,k)).join("\n")}\n`:"\nNo mistakes 🎉\n")+`\nLearned so far: ${learned(ALL)}/${ALL.length} · streak ${streak()} day(s)`;
  notify(msg);
  app.innerHTML=`<div class="result"><div class="small">${esc(S.deck.title)}</div><div class="score">${S.right}/${done}</div>
   <h2 class="disp" style="font-size:24px;margin-top:14px">${pct>=90?"Brilliant!":pct>=70?"Great work!":pct>=50?"Good, keep going!":"Practice makes perfect!"}</h2>
   ${S.miss.length?`<p>To review:</p><ul class="miss">${S.miss.map(m=>`<li>${esc(missLine(m,k).slice(2))}</li>`).join("")}</ul>`:""}
   <p class="small">${cfg.token?"Your result was sent to your teacher.":""}</p>
   <div class="row"><button class="alt grow" id="h">Home</button><button class="rose grow" id="again">Again</button></div></div>`;
  document.getElementById("h").onclick=home;
  const d=S.deck.id,mo=S.mode;document.getElementById("again").onclick=()=>start(d,mo);
}

function report(){
  const week=Date.now()-7*864e5,w=sessions.filter(s=>s.at>week);
  const avg=w.length?Math.round(w.reduce((a,s)=>a+s.score/s.total,0)/w.length*100):0;
  const hard=ALL.filter(c=>(prog[c.id]?.wrong||0)>0).sort((a,b)=>(prog[b.id].wrong-prog[b.id].right)-(prog[a.id].wrong-prog[a.id].right)).slice(0,8)
    .map(c=>`• ${c.en.length>60?c.en.slice(0,60)+"…":c.en} (${prog[c.id].wrong}× wrong, ${prog[c.id].right}× right)`).join("\n");
  return `📊 Progress report: ${studentName()}\nLesson 7: Discipline - your way to freedom\nLearned: ${learned(ALL)}/${ALL.length} cards\nStreak: ${streak()} day(s) · sessions: ${sessions.length} total, ${w.length} this week\nAverage score this week: ${avg}%\n\n`+
    DECKS.map(d=>`• ${d.title}: ${learned(d.cards)}/${d.cards.length} learned`).join("\n")+(hard?`\n\nHardest:\n${hard}`:"");
}

/* ---------- teacher setup (#teacher) ---------- */
function teacher(){
  app.innerHTML=`<div class="topbar"><a class="btn alt" href="#">← Back</a><span class="count">Teacher setup</span></div>
  <h1 class="disp">Connect your Telegram bot</h1>
  <div class="panel">
    <p style="margin-top:0">1. In Telegram, open <b>@BotFather</b>, send <b>/newbot</b> and copy the token.<br>2. Open your new bot and press <b>Start</b>.<br>3. Paste the token below and tap <b>Find my chat</b>.</p>
    <label for="tk">Bot token</label><input id="tk" autocomplete="off" placeholder="123456789:AA…" value="${esc(cfg.token||"")}">
    <div class="row"><button class="alt" id="find">Find my chat</button></div>
    <label for="ch">Your chat ID</label><input id="ch" inputmode="numeric" placeholder="e.g. 123456789" value="${esc(cfg.chat||"")}">
    <label for="nm">Student's name</label><input id="nm" value="${esc(cfg.name||"Alyona")}">
    <div class="row"><button class="rose grow" id="test">Send test message</button></div>
    <div class="status" id="st"></div>
  </div>
  <div class="panel" id="out" hidden>
    <b style="color:var(--navy)">Student's personal link</b>
    <p class="small">Send this link to your student. Her results will come to your Telegram. Keep it private: it contains your bot token.</p>
    <div class="linkbox" id="lnk"></div>
    <div class="row"><button class="grow" id="cp">Copy link</button><button class="alt grow" id="use">Use on this device</button></div>
  </div>`;
  const $=id=>document.getElementById(id),st=$("st");
  const cur=()=>({token:$("tk").value.trim(),chat:$("ch").value.trim(),name:$("nm").value.trim()||"Alyona"});
  const showLink=c=>{$("lnk").textContent=location.origin+location.pathname+"#join="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(c)))));$("out").hidden=false};
  $("find").onclick=async()=>{
    const t=$("tk").value.trim();if(!t){st.textContent="Paste the token first.";return}st.textContent="Looking…";
    try{const j=await (await fetch("https://api.telegram.org/bot"+t+"/getUpdates")).json();
      if(!j.ok){st.textContent="Telegram says: "+(j.description||"token not valid");return}
      const m=[...j.result].reverse().map(u=>u.message||u.edited_message).find(x=>x&&x.chat);
      if(!m){st.textContent="No messages yet. Open your bot in Telegram, press Start, then try again.";return}
      $("ch").value=m.chat.id;st.textContent="Found your chat"+(m.chat.first_name?" ("+m.chat.first_name+")":"")+". Now send a test message.";
    }catch(e){st.textContent="Could not reach Telegram. Get your chat ID from @userinfobot and paste it."}
  };
  $("test").onclick=async()=>{const c=cur();if(!c.token||!c.chat){st.textContent="Token and chat ID are both needed.";return}
    st.textContent="Sending…";const ok=await tgSend(`✅ Discipline flashcards connected. You'll get ${c.name}'s results here.`,c);
    st.textContent=ok?"Sent! Check Telegram, then copy the student link below.":"Not sent. Check the token and chat ID.";if(ok)showLink(c)};
  $("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("lnk").textContent);$("cp").textContent="Copied!"}catch(e){$("cp").textContent="Select the link and copy it"}};
  $("use").onclick=()=>{cfg=cur();LS.set("fc_cfg",cfg);location.hash=""};
  if(cfg.token&&cfg.chat)showLink(cfg);
}

function route(){readJoin();if(location.hash==="#teacher")teacher();else home()}
window.addEventListener("hashchange",route);
route();flush();
}
