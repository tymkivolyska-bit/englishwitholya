<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Writing Expert (Unit 1)</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a white wavy-edged "letter" with ribbon bows, floating on pale blue pinstripes (from the teacher's design). Single light look by choice. */
:root{
  --stripe:#cbd3e6;
  --ribbon:#a6b4d7;
  --ribbon-soft:#d3dbef;
  --paper:#ffffff;
  --ink:#27345a;
  --ink-soft:#5c6a8f;
  --wash:#eef2fb;
  --wash-2:#e2e8f6;
  --accent:#5a70ad;
  --accent-ink:#ffffff;
  --good:#3f8a68;
  --good-wash:#e3f3ea;
  --bad:#b8565b;
  --bad-wash:#f9e6e7;
  --font-display:"Lora",Georgia,"Times New Roman",serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{background:var(--stripe)}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  background:repeating-linear-gradient(90deg,var(--stripe) 0 29px,var(--paper) 29px 59px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:56px 72px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.paper{position:relative;max-width:860px;margin:0 auto;padding:64px 56px 78px;isolation:isolate}
.frame{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;pointer-events:none}
.bow{position:absolute;left:50%;transform:translateX(-50%);width:210px;pointer-events:none;z-index:1}
@media (max-width:560px){
  body{padding-block:44px 60px}
  .paper{padding:52px 24px 64px}
  .bow{width:150px}
}

/* header */
.brand{text-align:center;display:grid;gap:4px;margin-bottom:18px}
.brand .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0;text-wrap:balance}
.brand h1 em{font-style:italic;color:var(--accent);font-weight:500}

nav.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 auto 26px;padding:5px;background:var(--wash);border-radius:999px;width:fit-content;max-width:100%}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:15px}
nav.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(39,52,90,.15)}
nav.tabs a .tick{width:8px;height:8px;border-radius:50%;background:var(--ribbon-soft)}
nav.tabs a .tick.done{background:var(--good)}
@media (max-width:560px){nav.tabs{border-radius:18px;width:100%}nav.tabs a{padding:7px 11px;font-size:14px}}

h2{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--ink-soft);margin:0 0 18px}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* deck picker */
.decks{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:14px;scrollbar-width:thin}
.decks button{flex:0 0 auto;border:1.5px solid var(--ribbon-soft);background:var(--paper);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.decks button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.decks button .n{font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--wash);color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--ribbon);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.spacer{flex:1}

/* home */
.overall{display:flex;gap:20px;align-items:center;background:var(--wash);border-radius:var(--r);padding:16px 20px;margin-bottom:22px}
.ring{--p:0;width:86px;height:86px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--paper) 0)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--wash);display:grid;place-items:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.overall p{margin:0}
.overall b{font-family:var(--font-display);font-size:19px}
.decklist{display:grid;gap:12px}
.deckrow{border:1.5px solid var(--wash-2);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.deckrow header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.deckrow h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600}
.deckrow .lesson{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{border:0;background:var(--wash);border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:1px;min-width:0}
.chip .k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.chip .v{font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.chip .bar{height:5px;border-radius:3px;background:var(--paper);overflow:hidden;margin-top:4px}
.chip .bar i{display:block;height:100%;background:var(--accent)}
.chip.done{background:var(--good-wash)}
.chip.done .bar i{background:var(--good)}
.chip.done .v::after{content:"✓ done";font-size:12px;color:var(--good);font-weight:800}

/* flashcards */
.fc-wrap{perspective:1400px;margin:6px 0 14px}
.fc{position:relative;width:100%;min-height:290px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);display:block}
.fc.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:grid;place-content:center;gap:10px;text-align:center;padding:30px 22px;border:2px solid var(--ribbon-soft)}
.face.front{background:var(--paper)}
.face.back{background:var(--wash);transform:rotateY(180deg)}
.face .term{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,6vw,44px);line-height:1.15;word-break:break-word}
.face .full{font-weight:800;font-size:20px;color:var(--accent)}
.face .ua{font-family:var(--font-display);font-size:clamp(22px,4.6vw,30px);font-weight:600}
.face .ex{font-style:italic;color:var(--ink-soft);max-width:46ch;margin:4px auto 0}
.face .note{font-size:14px;background:var(--paper);border-radius:10px;padding:6px 10px;max-width:46ch;margin:0 auto}
.face .hint{position:absolute;bottom:12px;left:0;right:0;font-size:13px;color:var(--ink-soft)}
.status-pill{position:absolute;top:12px;left:14px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--wash);color:var(--ink-soft)}
.status-pill.known{background:var(--good-wash);color:var(--good)}
.say{border:0;background:var(--wash);width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;color:var(--accent);flex:0 0 auto}
.face.back .say{background:var(--paper)}
.say svg{width:20px;height:20px}
.say.speaking{background:var(--accent);color:#fff}
.say-row{display:flex;gap:8px;justify-content:center;align-items:center}
.fc-count{font-weight:800;font-variant-numeric:tabular-nums}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent);width:17px;height:17px}

/* quiz (learn + test) */
.progress{height:8px;border-radius:4px;background:var(--wash);overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{display:grid;gap:14px}
.q .prompt{background:var(--wash);border-radius:18px;padding:22px 18px;text-align:center;display:grid;gap:6px;justify-items:center}
.q .ask{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.q .big{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,5vw,34px);line-height:1.2;word-break:break-word}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--ribbon-soft);background:var(--paper);border-radius:12px;padding:13px 14px;text-align:left;font-weight:700;min-width:0;word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt.picked{border-color:var(--accent);background:var(--wash)}
.typein{display:flex;gap:8px}
.typein input{flex:1;min-width:0;border:1.5px solid var(--ribbon);border-radius:12px;padding:12px 14px;font-size:17px;background:var(--paper)}
.feedback{border-radius:12px;padding:12px 14px;font-weight:700}
.feedback.ok{background:var(--good-wash);color:var(--good)}
.feedback.no{background:var(--bad-wash);color:var(--bad)}
.feedback .ans{color:var(--ink);font-weight:600;display:block;margin-top:2px}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:9px;height:9px;border-radius:50%;background:var(--ribbon-soft)}
.lvl i.on{background:var(--good)}
.panel{background:var(--wash);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.panel h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:21px}
.score{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.history{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.history li{display:flex;justify-content:space-between;gap:10px;background:var(--paper);border-radius:10px;padding:7px 12px;font-variant-numeric:tabular-nums}
.review{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.review li{background:var(--paper);border-radius:10px;padding:9px 12px;border-left:4px solid var(--bad)}
.review li b{display:block}
.seg{display:inline-flex;background:var(--wash);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:800;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(39,52,90,.15)}

/* matching */
.mstats{display:flex;gap:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:12px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{min-height:86px;border-radius:14px;border:1.5px solid var(--ribbon-soft);background:var(--paper);padding:10px;font-weight:700;display:grid;place-items:center;text-align:center;line-height:1.25;word-break:break-word;transition:transform .15s,opacity .35s,background .2s}
.tile.en{font-family:var(--font-display);font-size:18px;font-weight:600;background:var(--wash)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--ribbon-soft);transform:scale(1.03)}
.tile.ok{background:var(--good-wash);border-color:var(--good);opacity:0;pointer-events:none}
.tile.miss{background:var(--bad-wash);border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.tile{transition:none}.tile.miss{animation:none}}

.foot{margin-top:30px;padding-top:16px;border-top:1.5px dashed var(--ribbon-soft);display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-soft)}
.foot select{border:1.5px solid var(--ribbon-soft);border-radius:10px;padding:5px 8px;background:var(--paper);max-width:100%;min-width:0}
.foot .grow{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cloud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;font-size:14px}
.cloud .dot{width:9px;height:9px;border-radius:50%;background:var(--ribbon-soft);flex:0 0 auto}
.cloud .dot.on{background:var(--good)}
.cloud .dot.err{background:var(--bad)}
.copybox{width:100%;min-height:120px;border:1.5px solid var(--ribbon);border-radius:10px;padding:8px;font:13px/1.4 var(--font-body)}
.student{border:1.5px solid var(--wash-2);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.student h3{margin:0;font-family:var(--font-display);font-size:21px;font-weight:600}
.tgrid{display:grid;gap:6px;overflow-x:auto}
.tgrid table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;font-variant-numeric:tabular-nums}
.tgrid th,.tgrid td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--wash-2)}
.tgrid th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.tgrid td.ok{color:var(--good);font-weight:800}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.log li{display:flex;gap:10px;background:var(--wash);border-radius:8px;padding:6px 10px}
.log li time{color:var(--ink-soft);flex:0 0 auto;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
</style>

</head>

const MATCH_GOAL=3, TEST_PASS=80;
function stats(deckId,st){
  st=st||S;
  const d=deckById(deckId), n=d.cards.length;
  const known=d.cards.filter(c=>(st.fc||{})[c.id]==="known").length;
  const learned=d.cards.filter(c=>((st.learn||{})[c.id]||0)>=2).length;
  const t=(st.tests||{})[deckId]||{best:null,history:[]};
  const m=(st.match||{})[deckId]||{rounds:0,best:null};
  return {n,known,learned,test:t,match:m,
    fcDone:known===n, learnDone:learned===n, testDone:(t.best||0)>=TEST_PASS, matchDone:m.rounds>=MATCH_GOAL};
}
function sectionDoneAll(key){
  return DECKS.slice(1).every(d=>{const s=stats(d.id);return key==="fc"?s.fcDone:key==="learn"?s.learnDone:key==="test"?s.testDone:s.matchDone});
}

const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
const FEMALE=/(female|woman|serena|kate|stephanie|martha|libby|sonia|hazel|maisie|mia|susan|fiona|amy|emma|olivia|bella|emily|catherine|karen|moira|tessa|samantha|victoria|zira|aria|jenny|ava|allison)/i;
const MALE=/(\bmale\b|daniel|arthur|george|ryan|oliver|thomas|alfie|elliot|noah|ethan|malcolm|james|harry|rishi|david|mark|guy|fred|alex|tom\b)/i;
let voices=[];
function loadVoices(){ if(!synth) return; voices=synth.getVoices()||[]; fillVoiceSelect(); }
function score(v){
  const lang=(v.lang||"").replace("_","-").toLowerCase(); let s=0;
  if(lang==="en-gb") s+=100; else if(lang.startsWith("en-gb")) s+=90; else if(lang.startsWith("en")) s+=20; else return -1;
  if(MALE.test(v.name) && !/female/i.test(v.name)) s-=60;
  if(FEMALE.test(v.name)) s+=40;
  if(/google uk english female/i.test(v.name)) s+=25;
  if(/natural|online|premium|enhanced/i.test(v.name)) s+=8;
  return s;
}
function bestVoice(){
  if(S.voice){const v=voices.find(v=>v.name===S.voice); if(v) return v;}
  let best=null,bs=-1; voices.forEach(v=>{const s=score(v); if(s>bs){bs=s;best=v}}); return best;
}
function fillVoiceSelect(){
  const sel=document.getElementById("voiceSel"); sel.textContent="";
  if(!synth){const o=document.createElement("option");o.textContent="Audio not supported in this browser";sel.appendChild(o);sel.disabled=true;return}
  const en=voices.filter(v=>(v.lang||"").toLowerCase().startsWith("en")).sort((a,b)=>score(b)-score(a));
  const auto=document.createElement("option"); auto.value=""; const bv=bestVoice();
  auto.textContent="Auto: British woman"+(bv&&!S.voice?" ("+bv.name+")":""); sel.appendChild(auto);
  en.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" · "+v.lang;sel.appendChild(o)});
  sel.value=S.voice&&en.some(v=>v.name===S.voice)?S.voice:"";
}
let speakingBtn=null;
function speak(text,btn){
  if(!synth||!text) return;
  synth.cancel();
  if(speakingBtn) speakingBtn.classList.remove("speaking");
  const u=new SpeechSynthesisUtterance(text.replace(/[…]/g,"...").replace(/\s\+\s/g," ").replace(/[✗✓]/g,""));
  const v=bestVoice(); if(v){u.voice=v;u.lang=v.lang} else u.lang="en-GB";
  u.rate=.92; u.pitch=1.05;
  if(btn){speakingBtn=btn;btn.classList.add("speaking");u.onend=u.onerror=()=>btn.classList.remove("speaking")}
  synth.speak(u);
}

function el(tag,attrs,...kids){
  const e=document.createElement(tag);

}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\(.*?\)/g," ").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function checkTyped(input,c){
  const target=c.en; const alts=target.split("/").map(norm).concat([norm(target)]);
  const x=norm(input); if(!x) return "no";
  if(alts.includes(x)) return "yes";
  if(alts.some(a=>a.length>5&&lev(a,x)<=1)) return "almost";
  return "no";
}

function distractors(c,pool,field,n){
  const seen=new Set([c[field]]); const out=[];
  shuffle(pool.filter(x=>x.id!==c.id)).forEach(x=>{ if(out.length<n&&!seen.has(x[field])){seen.add(x[field]);out.push(x)} });
  if(out.length<n) shuffle(CARDS.filter(x=>x.id!==c.id&&x.deck===c.deck)).forEach(x=>{ if(out.length<n&&!seen.has(x[field])){seen.add(x[field]);out.push(x)} });
  return out;
}

function sendResult(obj){
  const url=window.RESULTS_URL; if(!url) return false;
  const body=JSON.stringify(Object.assign({student:"Ira",at:Date.now()},obj));
  let ok=false; try{ok=navigator.sendBeacon(url,new Blob([body],{type:"text/plain"}))}catch(e){}

  return true;
}
/* Telegram deep-link payload (max 64 chars, A-Z a-z 0-9 _ -):
   r<deckIndex><pct>-<n>-<minutes since epoch, base36>-<missed card indexes in CARDS, 2 base36 chars each> */
function tgPayload(deckId,pct,t){
  const di=Math.max(0,DECKS.findIndex(x=>x.id===deckId));
  let p="r"+di+pct+"-"+t.qs.length+"-"+Math.floor(Date.now()/60000).toString(36)+"-";
  const missed=t.answers.filter(a=>!a.ok).map(a=>CARDS.findIndex(c=>c.id===a.card));
  for(const i of missed){ const code=i.toString(36).padStart(2,"0"); if(p.length+2>64) break; p+=code; }
  return p;
}

    grid.appendChild(b);
  });
  if(!M.start) view.appendChild(el("p",{class:"small muted mhint",style:"margin:0 0 10px",text:"The clock starts with your first tap."}));
  view.appendChild(grid);
}

/* ---------------- FRAME: wavy ribbon border drawn to fit the page ---------------- */
const paper=document.getElementById("paper");
function drawFrame(){
  const W=paper.clientWidth,H=paper.clientHeight; if(!W||!H) return;
  const small=W<520, A=small?6:9, m=A+7, r=small?34:56;
  const x0=m,y0=m,x1=W-m,y1=H-m, w=x1-x0,h=y1-y0;
  const straightW=w-2*r, straightH=h-2*r, arc=Math.PI*r/2;
  const P=2*straightW+2*straightH+4*arc;
  const waves=Math.max(6,Math.round(P/(small?150:210)));
  const lam=P/waves;
  // walk the rounded rectangle clockwise, starting at top centre
  function at(s){
    s=((s%P)+P)%P;
    const segs=[
      [straightW/2,t=>[x0+r+straightW/2+t,y0,0,-1]],
      [arc,t=>{const a=-Math.PI/2+t/r;return [x1-r+r*Math.cos(a),y0+r+r*Math.sin(a),Math.cos(a),Math.sin(a)]}],
      [straightH,t=>[x1,y0+r+t,1,0]],
      [arc,t=>{const a=t/r;return [x1-r+r*Math.cos(a),y1-r+r*Math.sin(a),Math.cos(a),Math.sin(a)]}],
      [straightW,t=>[x1-r-t,y1,0,1]],
      [arc,t=>{const a=Math.PI/2+t/r;return [x0+r+r*Math.cos(a),y1-r+r*Math.sin(a),Math.cos(a),Math.sin(a)]}],
      [straightH,t=>[x0,y1-r-t,-1,0]],
      [arc,t=>{const a=Math.PI+t/r;return [x0+r+r*Math.cos(a),y0+r+r*Math.sin(a),Math.cos(a),Math.sin(a)]}],
      [straightW/2,t=>[x0+r+t,y0,0,-1]],
    ];
    for(const [len,f] of segs){ if(s<=len) return f(s); s-=len; }
    return segs[segs.length-1][1](straightW/2);
  }
  const off=s=>A*Math.sin(2*Math.PI*s/lam)+A*.35*Math.sin(2*Math.PI*s/(lam*2.7));
  const step=4, pts=[];
  for(let s=0;s<P;s+=step){
    const [x,y,nx,ny]=at(s);
    const o=off(s);
    pts.push([x+nx*o,y+ny*o]);
  }
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++) d+="L"+pts[i][0].toFixed(1)+" "+pts[i][1].toFixed(1);
  d+="Z";
  document.getElementById("frameFill").setAttribute("d",d);
  document.getElementById("frameShadow").setAttribute("d",d);
  const svg=document.getElementById("frame"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  // bows sit on the ribbon at top centre and bottom centre
  const bt=document.getElementById("bowTop"), bb=document.getElementById("bowBot");
  const bw=bt.getBoundingClientRect().width||210;
  bt.style.top=(y0-62*(bw/320))+"px";
  const bbw=bb.getBoundingClientRect().width||200;
  const sb=straightW/2+arc+straightH+arc+straightW/2, yb=y1+off(sb);
  bb.style.top=(yb-73*(bbw/300)+2)+"px";
}
if("ResizeObserver" in window) new ResizeObserver(()=>drawFrame()).observe(paper); else window.addEventListener("resize",drawFrame);
document.getElementById("bowTop").addEventListener("load",drawFrame);
document.getElementById("bowBot").addEventListener("load",drawFrame);

/* ---------------- footer: voice + reset ---------------- */
document.getElementById("voiceSel").addEventListener("change",e=>{S.voice=e.target.value;save();fillVoiceSelect()});
document.getElementById("testVoice").addEventListener("click",e=>speak("Hello Ira! Let's practise your writing. Brilliant, see you later!",e.currentTarget));
function resetUI(){
  const area=document.getElementById("resetArea"); area.textContent="";
  area.appendChild(el("button",{class:"btn line",type:"button",style:"padding:6px 12px",onclick:()=>{
    area.textContent="";
    area.appendChild(el("span",{class:"confirm"},el("span",{text:"Delete all progress?"}),
      el("button",{class:"btn",type:"button",style:"padding:6px 12px;background:var(--bad)",onclick:()=>{const v=S.voice;S=blank();S.voice=v;save();fcOrder=null;L=null;T=null;M=null;resetUI();render();toast("Progress reset")}},"Yes, reset"),
      el("button",{class:"btn ghost",type:"button",style:"padding:6px 12px",onclick:resetUI},"Cancel")));
  }},"Reset progress"));
}
resetUI();

/* ---------------- RESULTS FOR THE TEACHER (artifact database) ---------------- */
let DB=null, ME=null, USER=null, IS_OWNER=false, cloud="checking", syncTimer=null, syncing=false, dirty=false, STUDENTS=null, PROFILES={};
function mergeProgress(remote){
  if(!remote) return;
  for(const k in remote.fc||{}){ if(remote.fc[k]==="known"||!S.fc[k]) S.fc[k]=remote.fc[k]; }
  for(const k in remote.learn||{}){ S.learn[k]=Math.max(S.learn[k]||0,remote.learn[k]||0); }
  for(const k in remote.tests||{}){ const a=S.tests[k]||{best:null,history:[]}, b=remote.tests[k];
    const seen=new Set(); const h=(a.history||[]).concat(b.history||[]).filter(x=>!seen.has(x.at)&&seen.add(x.at)).sort((x,y)=>x.at-y.at).slice(-20);
    S.tests[k]={best:Math.max(a.best||0,b.best||0)||((a.best===0||b.best===0)?0:null),history:h}; }
  for(const k in remote.match||{}){ const a=S.match[k]||{rounds:0,best:null}, b=remote.match[k];
    const bests=[a.best,b.best].filter(x=>x); S.match[k]={rounds:Math.max(a.rounds||0,b.rounds||0),best:bests.length?Math.min(...bests):null}; }
  const seen=new Set(); S.log=(S.log||[]).concat(remote.log||[]).filter(x=>{const key=x.at+x.mode;if(seen.has(key))return false;seen.add(key);return true}).sort((x,y)=>x.at-y.at).slice(-300);
}
function queueSync(){ if(!DB||!ME||IS_OWNER) return; dirty=true; clearTimeout(syncTimer); syncTimer=setTimeout(doSync,1500); }
async function doSync(){
  if(syncing){dirty=true;return} syncing=true; dirty=false;
  const {voice,deck,ua1,onlyLearning,...progress}=S;
  try{ await DB.doc("results/"+ME).set({progress,updatedAt:Date.now()}); cloud="on"; }
  catch(e){ cloud=(e&&e.code==="invalid_argument")?"readonly":"error"; if(cloud==="readonly") DB=null; }
  syncing=false; renderCloud(); if(dirty&&DB) queueSync();
}
function resultsText(){
  const lines=["Writing Expert (Unit 1) – my results, "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})];
  DECKS.slice(1).forEach(d=>{const s=stats(d.id);lines.push(d.name+": flashcards "+s.known+"/"+s.n+", learned "+s.learned+"/"+s.n+", test best "+(s.test.best==null?"–":s.test.best+"%")+", matching "+s.match.rounds+" rounds")});
  const recent=(S.log||[]).slice(-8);
  if(recent.length){lines.push("Recent:");recent.forEach(x=>lines.push("· "+new Date(x.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+deckById(x.deck).name+" – "+x.mode+": "+x.text))}
  return lines.join("\n");
}
function renderCloud(){
  const box=document.getElementById("cloud"); box.textContent="";
  if(IS_OWNER){box.append(el("span",{class:"dot on"}),el("span",{text:"You're the teacher here. Ira's saved results are in the “Ira's results” tab."}));return}
  const msg={checking:"Connecting…",on:"Your results are saved and shared with your teacher.",
    off:window.RESULTS_URL?"Your progress is saved on this device, and every test result goes to your teacher automatically.":"Your progress is saved on this device. After a test, tap “Send to my teacher”.",
    readonly:"Your progress is saved on this device. Ask your teacher to invite you by email so your results reach your teacher automatically.",
    error:"Couldn't reach the results store just now. Your progress is still saved on this device."}[cloud];
  box.append(el("span",{class:"dot"+(cloud==="on"?" on":cloud==="error"?" err":"")}),el("span",{text:msg}),el("span",{class:"spacer"}),
    el("button",{class:"btn line",type:"button",style:"padding:6px 12px",onclick:copyResults},"Copy my results"));
}
function copyResults(){
  const text=resultsText();
  const done=()=>toast("Copied. Paste it into a message to your teacher.");
  const fallback=()=>{const box=document.getElementById("cloud");let ta=box.querySelector("textarea");if(!ta){ta=el("textarea",{class:"copybox",id:"copyText","aria-label":"Your results"});box.appendChild(ta)}ta.value=text;ta.focus();ta.select();toast("Select all and copy this text.")};
  try{ navigator.clipboard.writeText(text).then(done,fallback); }catch(e){ fallback(); }
}
async function initCloud(){
  renderCloud();
  try{
    if(!window.claude||typeof window.claude.use!=="function"){cloud="off";renderCloud();return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){cloud="off";renderCloud();return}
    USER=user; IS_OWNER=!!(await user.isOwner());
    if(IS_OWNER){
      document.getElementById("teacherTab").hidden=false; DB=db; renderCloud();
      db.collection("results").onSnapshot(async snap=>{
        STUDENTS=snap.docs.map(d=>({id:d.id,...d.data()}));
        try{PROFILES=await user.profiles(STUDENTS.map(x=>x.id))}catch(e){}
        if(current==="teacher") render();
      },()=>{STUDENTS=STUDENTS||[];if(current==="teacher")render()});
      if(location.hash==="#teacher") render();
      return;
    }
    const id=await user.id(); if(!id){cloud="off";renderCloud();return}
    ME=id; DB=db;
    const snap=await db.doc("results/"+id).get();
    if(snap.exists){ mergeProgress((snap.data()||{}).progress); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} render(); }
    cloud="on"; renderCloud(); queueSync();
  }catch(e){ cloud=(e&&e.code==="invalid_argument")?"readonly":"error"; renderCloud(); }
}

/* TEACHER VIEW (only the page owner sees it) */
function Teacher(){
  view.append(el("h2",{text:"Ira's results"}),el("p",{class:"sub",text:"Updates live while she practises. Only you can see this tab."}));
  if(STUDENTS===null){view.appendChild(el("p",{class:"muted",text:"Loading results…"}));return}
  if(!STUDENTS.length){view.appendChild(el("div",{class:"panel"},el("h3",{text:"No results yet"}),
    el("p",{style:"margin:0",text:"Results arrive here when Ira practises while signed in to Claude, with the page shared to her email as an Editor (Share menu, top right). Until then she can tap “Copy my results” at the bottom of the page and send them to you."})));return}
  STUDENTS.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).forEach(st=>{
    const pr=st.progress||{}; const name=(PROFILES[st.id]&&PROFILES[st.id].name)||"Student";
    const card=el("article",{class:"student"},el("header",null,el("h3",{text:name}),
      el("span",{class:"muted small",text:"Last active "+(st.updatedAt?new Date(st.updatedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"–")})));
    const tb=el("table",null,el("thead",null,el("tr",null,...["Set","Flashcards","Learn","Test best","Matching"].map(h=>el("th",{text:h})))));
    const body=el("tbody");
    DECKS.slice(1).forEach(d=>{const s=stats(d.id,pr);
      body.appendChild(el("tr",null,el("td",{text:d.name}),
        el("td",{class:s.fcDone?"ok":"",text:s.known+"/"+s.n+(s.fcDone?" ✓":"")}),
        el("td",{class:s.learnDone?"ok":"",text:s.learned+"/"+s.n+(s.learnDone?" ✓":"")}),
        el("td",{class:s.testDone?"ok":"",text:(s.test.best==null?"–":s.test.best+"%")+(s.testDone?" ✓":"")}),
        el("td",{class:s.matchDone?"ok":"",text:s.match.rounds+" rounds"+(s.match.best?" · best "+(s.match.best/1000).toFixed(1)+" s":"")+(s.matchDone?" ✓":"")})))});
    tb.appendChild(body); card.appendChild(el("div",{class:"tgrid"},tb));
    const log=(pr.log||[]).slice(-25).reverse();
    if(log.length){const ul=el("ul",{class:"log"});
      log.forEach(x=>ul.appendChild(el("li",null,el("time",{text:new Date(x.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}),
        el("span",{text:deckById(x.deck).name+" · "+x.mode+": "+x.text}))));
      card.append(el("div",{class:"small muted",text:"Recent activity"}),ul);}
    view.appendChild(card);
  });
}

if(synth){loadVoices(); if("onvoiceschanged" in synth) synth.onvoiceschanged=loadVoices; setTimeout(loadVoices,600);} else fillVoiceSelect();
render();
initCloud();
</script>
